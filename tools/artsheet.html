<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쉿! UFO 그림 시트</title>
<style>
  html, body { margin: 0; background: #3d6fd8; color: #fff3d6; font: 13px/1.4 system-ui, sans-serif; }
  h2 { margin: 16px 16px 4px; font-size: 14px; }
  canvas { display: block; }
</style>
</head>
<body>
<!-- 개발용: 코드로 그리는 모든 그림을 한 장에 늘어놓는다. npm start 후 /tools/artsheet.html -->
<canvas id="sheet"></canvas>
<script type="module">
import { drawUfo, drawCloak, UFO_HALF_WIDTH } from '../src/render/ufo.js';
import { drawWatcher } from '../src/render/people.js';
import { drawSpecimen, drawRiskBadge } from '../src/render/specimens.js';
import { drawEmblem } from '../src/render/emblems.js';
import { SPECIMENS, MISSIONS, WATCHERS, SPECIALS } from '../src/data/content.js';

const cv = document.getElementById('sheet');
const W = 980, H = 1180, dpr = 2;
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
const ctx = cv.getContext('2d');
const params = new URLSearchParams(location.search);
const fixedT = params.has('t') ? Number(params.get('t')) : null;

function at(x, y, s, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); fn(); ctx.restore(); }
function cap(text, x, y) { ctx.fillStyle = '#1f2350'; ctx.font = '11px system-ui'; ctx.textAlign = 'center'; ctx.fillText(text, x, y); }

function frame(now) {
  const t = fixedT ?? now / 1000;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 낮 하늘 배경 + 지구인 줄마다 풀밭 띠(실제 게임 화면과 비슷한 대비로 본다)
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3d6fd8'); g.addColorStop(0.6, '#64a2f2'); g.addColorStop(1, '#c4e6ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#93d34f';
  for (const y of [520, 650, 780]) ctx.fillRect(0, y, W, 14);
  // 밤 무대(천문대·궤도)에서 어떻게 보이는지도 오른쪽 끝 띠에서 본다
  ctx.fillStyle = '#131a50'; ctx.fillRect(W - 70, 0, 70, H);

  const moods = ['idle', 'happy', 'alert', 'hide', 'shock'];
  // 형태 8종
  for (let f = 0; f < 8; f++) {
    const x = 70 + (f % 4) * 240 + 50, y = 80 + Math.floor(f / 4) * 130;
    at(x, y, 1.25, () => drawUfo(ctx, { form: f, t, mood: 'idle', lit: 1, beam: f % 2 }));
    cap(`form ${f} · hw ${UFO_HALF_WIDTH[f]}`, x, y + 62);
  }
  // 표정 5종 + 은폐
  moods.forEach((m, i) => {
    const x = 90 + i * 150, y = 350;
    at(x, y, 1.3, () => drawUfo(ctx, { form: 1, t, mood: m, lit: m === 'hide' ? 0.1 : 1 }));
    cap(m, x, y + 46);
  });
  at(850, 350, 1.2, () => { drawUfo(ctx, { form: 2, t, mood: 'hide', lit: 0.1 }); drawCloak(ctx, 2, t, 1); });
  cap('cloak', 850, 396);

  // 지구인: 걷기 / 올려다보기 / 들킴
  const types = Object.keys(WATCHERS);
  types.forEach((type, i) => {
    const x = 50 + i * 86, s = WATCHERS[type].scale || 1;
    const air = type === 'balloonist' || type === 'astronaut';
    at(x, 520 + (type === 'astronaut' ? -30 : 0), 1.2 * s, () => drawWatcher(ctx, type, { t, dir: 1, walk: 1, look: 0 }));
    at(x, 650 + (type === 'astronaut' ? -30 : 0), 1.2 * s, () => drawWatcher(ctx, type, { t, dir: -1, walk: 0, look: 1 }));
    at(x, 780 + (type === 'astronaut' ? -30 : 0), 1.2 * s, () => drawWatcher(ctx, type, { t, dir: 1, walk: 0, look: 1, shock: true }));
    cap(type, x, 800 + (air ? 0 : 0));
  });

  // 표본
  SPECIMENS.forEach((sp, i) => {
    const x = 60 + i * 92, y = 880;
    at(x, y, 1.5, () => drawSpecimen(ctx, sp.id, t, i % 2 ? -1 : 1));
    if (sp.risk > 0) drawRiskBadge(ctx, x + 22, y - 24, t);
    cap(sp.id, x, y + 52);
  });

  // 엠블럼
  [...MISSIONS.map((m) => m.id), ...Object.keys(SPECIALS)].forEach((id, i) => {
    const x = 50 + (i % 15) * 62, y = 1010 + Math.floor(i / 15) * 80;
    at(x, y, 1.3, () => drawEmblem(ctx, id, t));
    cap(id, x, y + 40);
  });
  if (fixedT === null) requestAnimationFrame(frame);
  else document.body.dataset.ready = '1';
}
requestAnimationFrame(frame);
</script>
</body>
</html>
