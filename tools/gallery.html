<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../style.css"><style>html,body{overflow:auto;display:block;background:#e9dec4}</style></head>
<body><canvas id="c" width="1440" height="1560"></canvas>
<script type="module">
import { LOOKS, getLook } from '../src/render/sprites.js';
import { drawSprite, text } from '../src/render/draw.js';
const c = document.getElementById('c'), g = c.getContext('2d');
await document.fonts.load("700 20px 'Gowun Batang'", '가A');
g.fillStyle = '#e9dec4'; g.fillRect(0, 0, c.width, c.height);
let i = 0;
for (const k of Object.keys(LOOKS)) {
  const L = getLook(k), col = i % 8, row = Math.floor(i / 8), x = 90 + col * 178, y = 300 + row * 330, s = L.scale * 2.1, h = L.hold;
  drawSprite(g, L.front, x, y, s, s);
  if (L.weapon) drawSprite(g, L.weapon, x + h.x * s, y + h.y * s, s, s, h.a);
  text(g, k, x, y + 30, { size: 20 }); i++;
}
window.done = true;
</script></body></html>
