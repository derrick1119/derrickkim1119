<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>쉿! UFO 아이콘</title>
<style>html, body { margin: 0; background: #111; } canvas { display: block; }</style>
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<!-- 개발용: 앱 아이콘을 3D 로 찍는다. tools/gen-icons.mjs 가 이 페이지를 열어 #icon 을 PNG 로 저장한다.
     ?size=512&maskable=1 -->
<canvas id="icon"></canvas>
<script type="module">
import { Engine } from '../src/render3d/engine.js';
import { buildStage } from '../src/render3d/stages.js';
import { createUfo, UFO_TILT } from '../src/render3d/ufo3d.js';

const q = new URLSearchParams(location.search);
const size = Number(q.get('size')) || 512;
const maskable = q.get('maskable') === '1';
const S = 512; // 이 크기로 장면을 짜고, 찍은 뒤 줄인다

// 농장 무대 위로 기체를 크게 띄운다(아래 3분의 1에 들판·헛간이 보이게)
const gl = document.createElement('canvas');
const engine = new Engine(gl);
engine.layout({ w: S, h: S, dpr: 2, groundY: 600, insetTop: 0 });
const stage = buildStage('farm', { w: S, h: S });
engine.setStage(stage);
stage.update(2, 1 / 60);
const ufo = createUfo(1);
ufo.update({ t: 0.6, mood: 'alert', lit: 1, beam: 0 });
ufo.root.rotation.x = UFO_TILT;
ufo.root.rotation.z = 0.08;
// 마스커블 아이콘은 런처가 가장자리를 잘라 내므로 가운데 80% 안에 들게 조금 작게
const widthPx = maskable ? 300 : 340;
ufo.root.scale.setScalar(widthPx / 64 / (2 * ufo.halfWidth));
ufo.root.position.copy(engine.toWorld(S / 2, maskable ? S * 0.44 : S * 0.42));
engine.actors.add(ufo.root);
engine.render();

const out = document.getElementById('icon');
out.width = out.height = size;
const ctx = out.getContext('2d');
if (!maskable) {
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, (112 / 512) * size);
  ctx.clip();
}
ctx.imageSmoothingQuality = 'high';
ctx.drawImage(gl, 0, 0, size, size);
document.body.dataset.ready = '1';
</script>
</body>
</html>
