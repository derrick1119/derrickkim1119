<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>쉿! UFO 아이콘</title>
<style>html, body { margin: 0; background: #111; } canvas { display: block; }</style>
</head>
<body>
<!-- 개발용: 앱 아이콘을 캔버스에 그린다. tools/gen-icons.mjs 가 이 페이지를 열어 PNG 로 저장한다.
     ?size=512&maskable=1 -->
<canvas id="icon"></canvas>
<script type="module">
import { drawUfo } from '../src/render/ufo.js';
import { P, glow, withAlpha, cumulus, tone } from '../src/render/draw.js';

const q = new URLSearchParams(location.search);
const size = Number(q.get('size')) || 512;
const maskable = q.get('maskable') === '1';
const cv = document.getElementById('icon');
cv.width = cv.height = size;
const ctx = cv.getContext('2d');
ctx.scale(size / 512, size / 512); // 512 기준으로 설계한다
const S = 512;

// 모서리: 마스커블은 꽉 찬 사각형(런처가 잘라 낸다), 일반 아이콘은 둥근 사각형
if (!maskable) {
  ctx.beginPath();
  ctx.roundRect(0, 0, S, S, 112);
  ctx.clip();
}
// 맑은 낮 하늘
const sky = ctx.createLinearGradient(0, 0, 0, S);
sky.addColorStop(0, P.skyTop);
sky.addColorStop(0.6, P.sky);
sky.addColorStop(1, P.skyLow);
ctx.fillStyle = sky;
ctx.fillRect(0, 0, S, S);
glow(ctx, 120, 90, 200, '#ffffff', 0.25);
// 뒤 구름
cumulus(ctx, [[60, 150, 46], [118, 132, 58], [180, 156, 40], [120, 170, 44]], { alpha: 0.9 });
cumulus(ctx, [[400, 108, 34], [446, 96, 44], [492, 112, 34]], { alpha: 0.85 });
// 언덕
const hill = (y0, amp, color, phase) => {
  ctx.beginPath();
  ctx.moveTo(0, S);
  for (let x = 0; x <= S; x += 8) ctx.lineTo(x, y0 - Math.sin((x / S) * Math.PI * 1.3 + phase) * amp);
  ctx.lineTo(S, S);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, y0 - amp, 0, S);
  g.addColorStop(0, tone(color, 0.18));
  g.addColorStop(1, tone(color, -0.15));
  ctx.fillStyle = g;
  ctx.fill();
};
hill(430, 26, P.grassDark, 0.6);
hill(468, 22, P.grass, 2.4);

// 기체와 견인 빔
const k = maskable ? 0.8 : 1; // 마스커블은 가운데 80% 안에 그린다
const cx = 256;
const cy = maskable ? 236 : 226;
const s = 4.1 * k;
const beam = ctx.createLinearGradient(0, cy, 0, S);
beam.addColorStop(0, withAlpha(P.glow, 0.7));
beam.addColorStop(1, withAlpha(P.glow, 0));
ctx.fillStyle = beam;
ctx.beginPath();
ctx.moveTo(cx - 16 * s, cy + 24 * s);
ctx.lineTo(cx + 16 * s, cy + 24 * s);
ctx.lineTo(cx + 40 * s, S);
ctx.lineTo(cx - 40 * s, S);
ctx.closePath();
ctx.fill();
ctx.save();
ctx.translate(cx, cy);
ctx.rotate(-0.07);
ctx.scale(s, s);
drawUfo(ctx, { form: 1, t: 0.6, mood: 'alert', lit: 1, beam: 1 });
ctx.restore();
// 앞을 살짝 가리는 구름(숨는 중)
cumulus(ctx, [[cx + 150 * k, cy + 70 * k, 46 * k], [cx + 196 * k, cy + 52 * k, 56 * k], [cx + 244 * k, cy + 78 * k, 42 * k], [cx + 190 * k, cy + 96 * k, 44 * k]], {});
document.body.dataset.ready = '1';
</script>
</body>
</html>
