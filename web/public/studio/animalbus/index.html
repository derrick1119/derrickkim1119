<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d2a3e">
<meta name="description" content="길이 트인 동물을 톡! 군중을 비집고 나와 같은 색 버스에 폴짝 — 동물 마을 버스 정류장 퍼즐.">
<title>동물 버스 정류장</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#2d2a3e;color:#fffaf0;font:16px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none}
main{max-width:460px;margin:0 auto;padding:0 0 24px}

h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.01em}
h1 span{color:#ffc857}
#game{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.g-canvas{display:block;margin:0 auto;touch-action:none;outline:none}
.g-canvas:focus-visible{box-shadow:0 0 0 3px #ffc857}

.g-overlay b{font-size:28px;word-break:keep-all}
.g-overlay span{font-size:16px;color:#cfc6e0}
.g-overlay:focus-visible{outline:3px solid #ffc857}
.ver{color:#8f86a8;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<main>
  <header><h1>🚌 동물 버스 <span>정류장</span></h1></header>
