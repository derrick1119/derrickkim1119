<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3b2a">
<meta name="description" content="목장을 톡 하면 강아지가 달려가 멍! 양 떼를 울타리에 몰아 넣는 한 손 퍼즐.">
<title>양치기 멍멍</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#2b3b2a;color:#fffaf0;font:16px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;overscroll-behavior:none}
#stage{position:relative;height:100dvh;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;outline:none;touch-action:none}
canvas:focus-visible{outline:3px solid #ffc857;outline-offset:-3px}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:linear-gradient(#2b3b2acc 0%,#2b3b2a99 45%,#1d281cf0 100%)}
h1{font-size:clamp(34px,10vw,52px);line-height:1.05;margin:0 0 6px;letter-spacing:-.02em}
h1 span{color:#ffc857}
.tag{color:#c9d6b8;margin:0 0 20px}
ol{list-style:none;padding:0;margin:0 0 22px;max-width:340px;text-align:left}
ol li{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;background:#1d281cd9;border:1px solid #4a5e3f;border-radius:12px;padding:10px 12px}
ol b{flex:none;width:24px;height:24px;border-radius:50%;background:#ffc857;color:#2b3b2a;display:grid;place-items:center;font-size:14px}
.big{font-size:52px;font-weight:900;margin:0;color:#ffc857;line-height:1}
#msg p{margin:0 0 8px}
.btn{min-width:200px;min-height:52px;border:0;border-radius:14px;background:#ffc857;color:#2b2416;font:800 19px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 0 #b8892a;margin:6px}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b8892a}
.btn:focus-visible{outline:3px solid #fffaf0;outline-offset:2px}
#best{color:#ffc857;font-weight:700;min-height:1.4em;margin:4px 0}
.keys{color:#c9d6b8;font-size:13px;margin-top:12px}
#retry{position:absolute;width:44px;height:44px;border-radius:12px;border:2px solid #7a3e1d;background:#fff6e4;color:#3b2a1e;font:900 22px system-ui,sans-serif;cursor:pointer;box-shadow:0 3px 0 #7a3e1d;padding:0}
#retry:active{transform:translateY(2px);box-shadow:0 1px 0 #7a3e1d}
#retry:focus-visible{outline:3px solid #ffc857;outline-offset:2px}
kbd{background:#1d281c;border-radius:4px;padding:1px 5px;font:inherit}
</style>
</head>
<body>
<main id="stage">
  <canvas id="game" tabindex="0" aria-label="양치기 멍멍 게임 화면. 목장을 누르고 있으면 양이 갈 자리가 보이고, 떼면 강아지가 짖어요. 키보드는 화살표로 고르고 스페이스."></canvas>
  <button id="retry" type="button" aria-label="이 판 처음부터 다시 (R)" title="이 판 처음부터 다시 (R)" hidden>↺</button>
  <section id="overlay">
    <h1>양치기 <span>멍멍</span></h1>
    <p class="tag">해 질 녘 언덕 목장, 양 떼를 집으로!</p>
    <div id="msg"></div>
    <ol>
      <li><b>1</b><span>목장을 톡 — 강아지가 달려가 <b style="display:inline;background:none;color:#ffc857;width:auto">멍!</b> 원 안의 양은 반대쪽으로 달아나요.</span></li>
      <li><b>2</b><span>양을 모두 울타리에 넣으면 통과. 누르고 있으면 양이 갈 자리가 보여요.</span></li>
    </ol>
    <button id="start" class="btn" type="button">시작</button>
    <p id="best"></p>
    <p class="keys">키보드: <kbd>← ↑ → ↓</kbd> 고르기 · <kbd>스페이스</kbd> 누르고 떼면 멍! · <kbd>R</kbd> 다시</p>
  </section>
</main>
