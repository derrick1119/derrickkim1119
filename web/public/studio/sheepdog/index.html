<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8ecff0">
<meta name="description" content="목장을 톡 하면 강아지가 달려가 멍! 양 떼를 울타리에 몰아 넣는 한 손 퍼즐.">
<title>양치기 멍멍</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#2b3b2a;color:#fffaf0;font:16px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;overscroll-behavior:none}
#stage{position:relative;height:100dvh;max-width:560px;margin:0 auto;display:flex;align-items:flex-start;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;outline:none;touch-action:none}
canvas:focus-visible{outline:3px solid #ffc857;outline-offset:-3px}
#overlay{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px max(16px,env(safe-area-inset-bottom));text-align:center;background:linear-gradient(rgba(255,246,228,0) 55%,rgba(74,51,34,.55) 100%)}
/* 타이틀·끝 (C009 M1-5b, 🎨 §12-8·9): 검은 막 없이 1-1 디오라마가 보인다 */
.logo{margin:4px 0 0;line-height:1;transform:rotate(-3deg)}
.logo span{display:inline-block;font-weight:900;letter-spacing:-.02em;text-shadow:4px 0 #fff6e4,-4px 0 #fff6e4,0 4px #fff6e4,0 -4px #fff6e4,3px 3px #fff6e4,-3px 3px #fff6e4,3px -3px #fff6e4,-3px -3px #fff6e4,0 8px 0 #7a3e1d}
.logo .a{font-size:40px;color:#3b2a1e}
.logo .b{font-size:48px;color:#ffc857}
.tag{margin:10px 0 0;padding:6px 14px;background:#fff6e4;border:2px solid #7a3e1d;border-radius:18px;box-shadow:0 3px 0 #7a3e1d;color:#3b2a1e;font:800 15px/1.2 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.panel{width:min(360px,100%);margin-top:auto;background:#fff6e4;color:#3b2a1e;border:3px solid #7a3e1d;border-radius:20px;box-shadow:0 6px 0 #c98a4a,0 14px 30px rgba(20,12,6,.4);padding:14px 16px 10px}
#rules{list-style:none;padding:0;margin:0 0 12px;text-align:left}
#rules li{display:flex;gap:10px;align-items:center;margin:0;padding:6px 0;font:700 15px/1.35 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#rules li+li{border-top:2px dashed #e3d3b8}
#rules svg{flex:none;width:36px;height:36px}
#rules b{color:#c0611f}
#msg h2{margin:0 0 4px;font:900 24px/1.2 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.big{display:flex;align-items:center;justify-content:center;gap:6px;font:900 40px/1 system-ui,sans-serif;margin:4px 0 10px;color:#3b2a1e}
.big svg{width:36px;height:36px}
.grid{list-style:none;padding:0;margin:0 0 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid li{background:#fbeed6;border:2px solid #e3d3b8;border-radius:10px;padding:4px 0 3px;font:900 12px/1 system-ui,sans-serif;color:#6b5444}
.grid li span{display:flex;justify-content:center;margin-top:3px}
.grid svg{width:15px;height:15px}
.score{margin:0 0 8px;font:900 20px/1.2 system-ui,sans-serif;white-space:nowrap}
.btn{min-width:200px;min-height:52px;border:3px solid #7a3e1d;border-radius:14px;background:#fff6e4;color:#3b2a1e;font:900 19px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;cursor:pointer;box-shadow:0 4px 0 #7a3e1d;margin:6px;transition:transform 60ms,box-shadow 60ms;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.main{background:#ffc857}
#start{width:220px;min-height:56px;font-size:20px;margin:0 0 4px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #7a3e1d}
.btn:focus-visible{outline:3px solid #7a3e1d;outline-offset:3px}
.btn svg{width:18px;height:18px}
#best{color:#a0662f;font:800 14px/1.2 system-ui,sans-serif;min-height:1.2em;margin:4px 0 0}
.keys{display:none;color:#6b5444;font-size:13px;margin:6px 0 0}
@media (hover:hover) and (pointer:fine){.keys{display:block}}
#retry{position:absolute;z-index:3;width:44px;height:44px;border-radius:22px;border:3px solid #7a3e1d;background:#fff6e4;color:#3b2a1e;font:900 22px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 0 #7a3e1d;padding:0;display:grid;place-items:center}
#retry svg,#sound svg{width:24px;height:24px}
#sound{position:absolute;z-index:5;width:44px;height:44px;border-radius:22px;border:3px solid #7a3e1d;background:#fff6e4;cursor:pointer;box-shadow:0 4px 0 #7a3e1d;padding:0;display:grid;place-items:center}
#sound[aria-pressed=false]{background:#d9d0c0}
#sound:active{transform:translateY(2px);box-shadow:0 2px 0 #7a3e1d}
#sound:focus-visible{outline:3px solid #7a3e1d;outline-offset:3px}
#retry:active{transform:translateY(2px);box-shadow:0 1px 0 #7a3e1d}
#retry:focus-visible{outline:3px solid #ffc857;outline-offset:2px}
/* 결과 카드 (C008 M1-5a, 🎨 ART §12-6): 탁자에서 올라오는 크림 카드 */
#card{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));width:min(340px,88vw);transform:translateX(-50%);background:#fff6e4;color:#3b2a1e;border:3px solid #7a3e1d;border-radius:20px;box-shadow:0 6px 0 #c98a4a,0 14px 30px rgba(20,12,6,.45);padding:14px 16px 16px;text-align:center;z-index:3}
#card.up{animation:cardUp .32s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardUp{from{transform:translate(-50%,120%)}to{transform:translate(-50%,0)}}
#card h2{margin:2px 0 6px;font:900 24px/1.2 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#card .say{position:absolute;left:10px;top:-34px;margin:0;background:#fff6e4;border:2px solid #7a3e1d;border-radius:14px;padding:4px 10px;font:800 13px/1.3 system-ui,sans-serif;color:#3b2a1e;white-space:nowrap}
#card .say::after{content:"";position:absolute;left:18px;bottom:-8px;border:6px solid transparent;border-top-color:#7a3e1d}
#card .stars{display:flex;justify-content:center;gap:10px;margin:2px 0 8px}
#card figure{margin:0;width:84px}
#card figure svg{width:48px;height:48px;display:block;margin:0 auto}
#card figure.on svg{animation:starPop .36s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(.3s + var(--k) * .25s)}
#card figure.had svg{opacity:.55}
@keyframes starPop{0%{transform:scale(0)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
#card figcaption{font:800 13px/1.2 system-ui,sans-serif;color:#6b5444;white-space:nowrap}
#card .medal{position:absolute;right:-10px;top:-18px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;transform:rotate(-12deg);font:900 13px/1 system-ui,sans-serif}
#card .medal.none{display:none}
#card .medal.gold{background:#fff6e4;border:3px solid #e8414f;color:#c62f3c;animation:stamp .3s cubic-bezier(.3,1.6,.5,1) 1.35s both}
#card .medal.grey{background:#f3ece0;border:3px dashed #b8ad9c;color:#6b5444}
@keyframes stamp{0%{transform:rotate(-12deg) scale(1.6);opacity:0}70%{transform:rotate(-12deg) scale(1) translateX(2px);opacity:1}85%{transform:rotate(-12deg) translateX(-2px)}100%{transform:rotate(-12deg) scale(1);opacity:1}}
#card .row{display:flex;gap:8px;justify-content:center;align-items:center}
#card .btn{min-width:0;flex:1;margin:0;min-height:48px;font-size:17px;background:#ffc857;border:3px solid #7a3e1d;box-shadow:0 4px 0 #7a3e1d;transition:transform 60ms,box-shadow 60ms}
#card .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #7a3e1d}
#card .btn:focus-visible{outline:3px solid #7a3e1d;outline-offset:3px}
#card .btn.ghost{background:#fff6e4;color:#3b2a1e;border:3px solid #7a3e1d;box-shadow:0 4px 0 #7a3e1d}
#card .btn.ghost.small{flex:0 0 auto;padding:0 12px;font-size:14px}
@media (prefers-reduced-motion:reduce){#card.up,#card figure.on svg,#card .medal.gold{animation:none}}
/* HUD (C009 M1-5b, 🎨 ART §12-3·4·5·10): 캔버스 밖 DOM — 이모지 없이 SVG */
.pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 7px;background:#fff6e4;border:2px solid #7a3e1d;border-radius:20px;box-shadow:0 3px 0 #7a3e1d;color:#3b2a1e;font:900 15px/1 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;white-space:nowrap}
.pill svg{flex:none}
#hudTop,#hudBot,#news{position:absolute;pointer-events:none;z-index:2}
#hudTop{display:flex;align-items:center;gap:8px;padding:0 110px 0 8px}
#hudTop .no{width:26px;height:26px;border-radius:50%;background:#7a3e1d;color:#fff6e4;display:grid;place-items:center;font:900 13px/1 system-ui,sans-serif}
#hudTop .nm{overflow:hidden;text-overflow:ellipsis}
#hudTop .stage{min-width:0}
#hudTop .total{margin-left:auto;padding:0 12px 0 9px}
#hudTop .total svg{width:18px;height:18px}
#hudTop .total b{font-size:16px}
#news{margin-left:10px;padding:8px 12px;background:#fff6e4;border:2px solid #7a3e1d;border-radius:14px;box-shadow:0 3px 0 #7a3e1d;color:#3b2a1e;font:800 15px/1.3 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#news{display:flex;align-items:center;gap:6px}
#news svg{width:24px;height:24px;flex:none}
#news::after{content:"";position:absolute;left:16px;bottom:-10px;border:7px solid transparent;border-top-color:#7a3e1d;border-bottom:0}
#news.pop{animation:newsIn 3.3s ease both}
@keyframes newsIn{0%{transform:translateY(-6px) scale(.9);opacity:0}6%{transform:none;opacity:1}90%{transform:none;opacity:1}100%{transform:translateY(-10px) scaleY(.6);opacity:0}}
#hudBot{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 8px 0}
#hudBot.card{visibility:hidden}
#hudBot .row1{display:flex;gap:8px;justify-content:center}
#hudBot .bones{gap:3px;padding:0 12px}
#hudBot .bones i{display:inline-flex;align-items:center;position:relative}
#hudBot .bones svg{width:22px;height:15px}
#hudBot .bones i.par::before{content:"";position:absolute;left:-3px;top:-6px;width:3px;height:27px;border-radius:2px;background:#ffc857;box-shadow:0 0 0 1px #7a3e1d}
#hudBot .bones b{font-size:17px;margin-left:2px}
#hudBot .sheep{padding:0 12px 0 6px}
#hudBot .sheep svg{width:24px;height:24px}
#hudBot .sheep b{font-size:18px}
#hudBot .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 10px 0 6px;border-radius:17px;border:2px solid #7a3e1d;background:#fff6e4;color:#3b2a1e;font:800 13px/1 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;white-space:nowrap;position:relative}
.chip svg{width:18px;height:18px}
.chip.on{background:#ffc857;animation:chipPop .4s cubic-bezier(.2,1.6,.4,1) both}
.chip.had svg{opacity:.55}
.chip.off{background:#d9d0c0;color:#6b5444;border-color:#9c8566}
.chip.off::before{content:"";position:absolute;left:5px;top:16px;width:22px;height:2px;background:#6b5444;transform:rotate(-40deg)}
@keyframes chipPop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#news.pop,.chip.on{animation:none}}
/* 빈 하늘 구름 (🎨 C010): 세로 화면 위 하늘 띠에 셋, 천천히 좌우로 */
#sky{position:fixed;left:0;top:0;width:100%;pointer-events:none;z-index:1;overflow:hidden}
#sky svg{position:absolute;animation:sway 18s ease-in-out infinite alternate}
#sky svg:nth-child(1){left:5%;top:30%}
#sky svg:nth-child(2){left:60%;top:12%;animation-duration:24s}
#sky svg:nth-child(3){left:74%;top:62%;animation-duration:30s}
#sky.title svg:nth-child(1){left:3%;top:78%}
#sky.title svg:nth-child(3){left:72%;top:70%}
@keyframes sway{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
@media (prefers-reduced-motion:reduce){#sky svg{animation:none}}
kbd{background:#fbeed6;border:1px solid #e3d3b8;border-radius:4px;padding:1px 5px;font:inherit}
</style>

<main id="stage">

      <p class="keys">키보드: <kbd>← ↑ → ↓</kbd> 고르기 · <kbd>스페이스</kbd> 누르고 떼면 멍! · <kbd>R</kbd> 다시 · <kbd>M</kbd> 소리</p>
    </div>
  </section>
