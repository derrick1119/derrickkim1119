<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a33">
<meta name="description" content="꾹 누르면 세상이 느려지고, 떼면 번쩍! 한 줄로 여럿을 베는 꼬마 사무라이.">
<title>벽력일섬</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#141a33;color:#f4ead2;font:16px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none}
main{max-width:460px;margin:0 auto;padding:0 0 16px}
header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.01em}
h1 span{color:#ffd36b}
header small{color:#8c93b8;font-size:12px;margin-right:4px}
.tg{display:flex;align-items:center;gap:4px}
.tg button{min-width:44px;height:44px;border:0;border-radius:0;background:transparent;color:#dfe6ff;font-size:18px;font-weight:800;cursor:pointer;padding:0 4px}
.tg button:focus-visible{outline:3px solid #ffd36b}
#game{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.g-canvas{display:block;margin:0 auto;touch-action:none;outline:none;image-rendering:pixelated}
.g-canvas:focus-visible{box-shadow:0 0 0 3px #ffd36b}
.g-overlay{position:absolute;inset:0;margin:auto;width:100%;border:0;outline:none;background:#0d1126d9;color:#f4ead2;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px}
.g-overlay em{font-style:normal;font-size:56px;line-height:1}
.g-overlay b{font-size:32px;font-weight:900;color:#f4ead2;text-shadow:0 3px 0 #000a}
.g-overlay ul{list-style:none;margin:10px 0 4px;padding:0;display:grid;grid-template-columns:repeat(3,100px);gap:12px}
.g-overlay li{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:0;background:#f4ead2;color:#1d2240;box-shadow:0 0 0 3px #313c68,3px 3px 0 3px #0e0f22;font-size:13px;font-weight:800;line-height:1.25;word-break:keep-all}
.g-overlay li i{font-style:normal;font-size:22px;font-weight:900;color:#b0471f;line-height:1.2}
.g-overlay strong{margin-top:6px;min-width:200px;padding:12px 24px;border-radius:0;background:#ffd340;color:#2a1d00;font-size:20px;font-weight:900;box-shadow:0 5px 0 #a8741c}
.g-overlay:focus-visible strong{outline:3px solid #f4ead2;outline-offset:3px}
.g-overlay span{font-size:14px;color:#8c93b8;word-break:keep-all}
.g-overlay span.msg{font-size:17px;font-weight:800;color:#f4ead2}
.g-overlay span.best{color:#ffd36b;font-weight:800}
.g-pick{cursor:default;overflow:auto;justify-content:flex-start;padding-top:28px}
.g-pick .grid{display:grid;grid-template-columns:repeat(2,minmax(0,160px));gap:12px}
.g-pick button{border:0;border-radius:0;background:#f4ead2;color:#1d2240;font:inherit;font-size:12px;font-weight:800;padding:6px 2px;min-height:44px;cursor:pointer;box-shadow:0 0 0 3px #313c68,3px 3px 0 3px #0e0f22;display:flex;flex-direction:column;align-items:center;gap:2px}
.g-pick button i{font-style:normal;font-size:16px;font-weight:900;color:#b0471f}
.g-pick button .n{font-size:13px;display:flex;gap:4px;align-items:center;color:#1d2240}
.g-pick button em{font-style:normal;color:#b0471f;font-size:12px}
.g-pick button small{font-size:12px;color:#5a5f80;font-weight:700;word-break:keep-all}
.g-pick button:focus-visible{outline:3px solid #ffd36b}
.g-pick .row{display:flex;gap:10px;margin-top:6px}
.g-pick .row button{padding:10px 18px;font-size:16px}
@media (hover:none){.g-overlay span.kbd{display:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pt{display:inline}
.pw{display:inline-block;vertical-align:middle;image-rendering:pixelated}
.pw+.pw{margin-left:.22em}
.owlbox{display:flex;flex-direction:column;align-items:center;gap:8px;background:#1e2448;padding:16px 18px 18px;box-shadow:0 0 0 3px #ffd36b,0 0 0 6px #0e0f22,6px 6px 0 6px #0e0f22;margin-top:40px;max-width:340px}
.owlface{image-rendering:pixelated;margin-top:-58px}
</style>
</head>
<body>
<main>
  <header><h1>벽력<span>일섬</span></h1><div class="tg"><small hidden>빌드 M3-F1</small><button id="pick" type="button" aria-label="판 고르기">판</button><button id="sound" type="button" aria-label="소리 끄기">소리</button></div></header>
  <div id="game"></div>
</main>
