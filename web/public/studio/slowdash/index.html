<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a33">
<meta name="description" content="꾹 누르면 세상이 느려지고, 떼면 번쩍! 한 줄로 여럿을 베는 여우 닌자.">
<title>느린 시간 닌자</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#141a33;color:#f4ead2;font:16px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none}
main{max-width:460px;margin:0 auto;padding:0 0 16px}
header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.01em}
h1 span{color:#ffd36b}
header small{color:#8c93b8;font-size:12px;margin-right:4px}
.tg{display:flex;align-items:center;gap:4px}
.tg button{width:44px;height:44px;border:0;border-radius:22px;background:transparent;font-size:20px;cursor:pointer;padding:0}
.tg button:focus-visible{outline:3px solid #ffd36b}
#game{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.g-canvas{display:block;margin:0 auto;touch-action:none;outline:none}
.g-canvas:focus-visible{box-shadow:0 0 0 3px #ffd36b}
.g-overlay{position:absolute;inset:0;margin:auto;width:100%;border:0;outline:none;background:#0d1126d9;color:#f4ead2;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px}
.g-overlay em{font-style:normal;font-size:56px;line-height:1}
.g-overlay b{font-size:32px;font-weight:900;color:#f4ead2;text-shadow:0 3px 0 #000a}
.g-overlay ul{list-style:none;margin:10px 0 4px;padding:0;display:grid;grid-template-columns:repeat(3,100px);gap:8px}
.g-overlay li{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:14px;background:#f4ead2;color:#1d2240;box-shadow:0 3px 0 #8c93b8;font-size:13px;font-weight:800;line-height:1.25;word-break:keep-all}
.g-overlay li i{font-style:normal;font-size:22px;font-weight:900;color:#b0471f;line-height:1.2}
.g-overlay strong{margin-top:6px;min-width:200px;padding:12px 24px;border-radius:28px;background:linear-gradient(#ffe08a,#f0b43a);color:#2a1d00;font-size:20px;font-weight:900;box-shadow:0 5px 0 #a8741c}
.g-overlay:focus-visible strong{outline:3px solid #f4ead2;outline-offset:3px}
.g-overlay span{font-size:14px;color:#8c93b8;word-break:keep-all}
.g-overlay span.msg{font-size:17px;font-weight:800;color:#f4ead2}
.g-overlay span.best{color:#ffd36b;font-weight:800}
.g-pick{cursor:default;overflow:auto;justify-content:flex-start;padding-top:28px}
.g-pick .grid{display:grid;grid-template-columns:repeat(2,minmax(0,160px));gap:6px}
.g-pick button{border:0;border-radius:12px;background:#f4ead2;color:#1d2240;font:inherit;font-size:12px;font-weight:800;padding:6px 2px;min-height:44px;cursor:pointer;box-shadow:0 3px 0 #8c93b8;display:flex;flex-direction:column;align-items:center;gap:2px}
.g-pick button i{font-style:normal;font-size:16px;font-weight:900;color:#b0471f}
.g-pick button .n{font-size:13px;display:flex;gap:4px;align-items:center}
.g-pick button em{font-style:normal;color:#b0471f;font-size:12px}
.g-pick button small{font-size:11px;color:#5a5f80;font-weight:700;word-break:keep-all}
.g-pick button:focus-visible{outline:3px solid #ffd36b}
.g-pick .row{display:flex;gap:10px;margin-top:6px}
.g-pick .row button{padding:10px 18px;font-size:16px}
@media (hover:none){.g-overlay span.kbd{display:none}}
</style>
</head>
