<head>
<meta charset="utf-8">

<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#fff6e8;color:#3a2a3f;font:16px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none}
main{max-width:460px;margin:0 auto;padding:0 0 24px}
header{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;flex-wrap:wrap}
h1{font-size:20px;font-weight:900;margin:0}
h1 span{color:#d99a12}
.tag{font-size:13px;font-weight:800;background:#3a2a3f;color:#fff6e8;border-radius:10px;padding:2px 8px}
#hud{margin:0 12px 6px;font-weight:800;font-size:17px}
#game{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.g-canvas{display:block;margin:0 auto;touch-action:none;outline:none}
.g-canvas:focus-visible{box-shadow:0 0 0 3px #ffc93c}
.rot{position:absolute;bottom:8px;width:56px;height:56px;border-radius:28px;border:2px solid #3a2a3f;background:#fff6e8;color:#3a2a3f;font:900 28px system-ui,sans-serif;box-shadow:0 3px 0 #3a2a3f40;cursor:pointer}
.rot.l{left:8px}.rot.r{right:8px}
.rot:focus-visible{outline:3px solid #ffc93c}
#bar{margin:8px 12px 0;display:flex;gap:8px;align-items:center;min-height:52px}
#msg{flex:1;font-size:16px;font-weight:700;word-break:keep-all}
#retry{min-width:72px;min-height:52px;border:2px solid #3a2a3f;border-radius:26px;background:#fff6e8;color:#3a2a3f;font:900 17px system-ui,sans-serif;cursor:pointer}
#again{min-width:112px;min-height:52px;border:0;border-radius:26px;background:#ffc93c;color:#3a2a3f;font:900 18px system-ui,sans-serif;box-shadow:0 3px 0 #d99a12;cursor:pointer}
.rules{margin:10px 14px 0;padding:0;list-style:none;font-size:15px;word-break:keep-all}
.ver{color:#7a5a6e;font-size:13px;text-align:center;margin:10px 12px 0}
</style>
