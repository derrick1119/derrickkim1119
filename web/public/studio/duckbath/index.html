<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123a48">
<meta name="description" content="물을 톡 치면 찰박! 물결이 고무 오리를 비누 거품 둥지로 밀어 줘요.">
<title>욕조 물결 오리</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#123a48;color:#fffaf0;font:16px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none}
main{max-width:460px;margin:0 auto;padding:0 0 24px}
@media (min-width:461px){main{padding:0 10px 24px}}
header{height:44px;display:flex;align-items:center;padding:0 8px 0 12px}
h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.01em}
h1 span{color:#ffd84a}
#game{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.g-canvas{display:block;margin:0 auto;border-radius:0;touch-action:none;outline:none}
.g-canvas:focus-visible{box-shadow:0 0 0 3px #ffd84a}
.g-overlay{position:absolute;inset:0;margin:auto;width:min(100%,440px);border:0;border-radius:14px;background:#123a48b8;color:#fffaf0;font:inherit;cursor:pointer;display:grid;place-content:center;gap:6px;text-align:center;padding:16px}
.g-overlay b{font-size:34px}
.g-overlay span{font-size:15px;color:#bfeaf2}
.g-overlay:focus-visible{outline:3px solid #ffd84a}
.ver{color:#6f9fab;font-size:12px;text-align:center;margin-top:10px}
.card{position:fixed;left:50%;top:0;z-index:5;transform:translateX(-50%);width:min(calc(var(--cw,390px) - 24px),360px);box-sizing:border-box;background:#0b2c39;border:2px solid #3e7f92;border-radius:20px;padding:12px 14px;box-shadow:0 8px 24px #0006;color:#fffaf0;text-align:center}
.card.lose{border-color:#ffb3a8}
.card h2{margin:0 0 6px;font-size:22px;font-weight:900;line-height:1.25;word-break:keep-all}
.card.win h2{font-size:24px;line-height:1.1;margin-bottom:4px;color:#ffd84a}
.card ul{list-style:none;margin:0 0 8px;padding:0;text-align:left}
.card li{font-size:15px;font-weight:700;line-height:1.3;margin:1px 0;display:flex;gap:8px;align-items:center}
.card li i{font-style:normal;font-size:17px;color:#ffd84a;width:22px;text-align:center}
.card li.todo{color:#a9d3dc}
.card li.todo i{color:#6f9fab}
.card li.gold b{color:#ff9f43;font-weight:800}
.card li:first-child:empty{display:none}
.card .tip{margin:0 0 6px;font-size:15px;font-weight:700;color:#ffe9a8;word-break:keep-all}
.card .soon{margin:0 0 8px;font-size:15px;font-weight:700;color:#bff3ff}
.card .ico{flex:none;width:44px;height:44px;border:2px solid #2e6576;border-radius:22px;background:#1b4b5b;color:#a9d3dc;font:800 18px system-ui,sans-serif;cursor:pointer;padding:0}
.card .why{margin:0 0 12px;font-size:15px;color:#a9d3dc}
.card .row{display:flex;gap:8px}
.card .btn{flex:1.5;min-height:48px;border:0;border-radius:26px;background:#ffd23a;color:#3a2a00;font:800 18px system-ui,sans-serif;box-shadow:0 4px 0 #e29a00;cursor:pointer}
.card .btn2{flex:1;min-height:44px;align-self:center;border:2px solid #2e6576;border-radius:22px;background:#1b4b5b;color:#fffaf0;font:800 16px system-ui,sans-serif;cursor:pointer}
.card button:focus-visible{outline:3px solid #ffd84a;outline-offset:2px}
.levels{position:absolute;inset:0;z-index:4;background:#123a48;display:flex;flex-direction:column;align-items:center;padding:12px;text-align:center;overflow-y:auto;overscroll-behavior:contain;scroll-padding-bottom:84px}
.levels .in{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.levels h2{margin:0;font-size:24px;font-weight:900}
.levels .sum{margin:0 0 2px;font-size:18px;font-weight:800;color:#ffd84a}
.levels .grid{display:grid;grid-template-columns:repeat(5,58px);gap:8px}
.levels .world{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px}
.levels .w1{--band:#bde8da;--edge:#93cdbb}
.levels .w2{--band:#f7c7a8;--edge:#e3a683}
.levels .w3{--band:#a9d6f5;--edge:#7db6e3}
.levels h3{margin:0;width:314px;height:32px;border-radius:10px;background:var(--band);color:#123a48;font-size:17px;font-weight:900;display:flex;gap:10px;align-items:center;justify-content:center}
.levels h3 small{font-size:15px;font-weight:800}
.lv{position:relative;width:58px;height:58px;border-radius:14px;border:2px solid var(--edge,#3e7f92);background:#1b4b5b;color:#fffaf0;font:800 18px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}
.lv span{font-size:13px;color:#ffd84a;letter-spacing:0;white-space:nowrap}
.lv span i{font-style:normal;color:#6f9fab}
.lv:disabled{cursor:default;background:#123a48;border-color:#2e6576}
.lv:disabled b{font-size:24px;line-height:1}
.lv:disabled span{color:#a9d3dc;font-weight:800}
.lv.soon{opacity:.22;border-style:dashed;background:transparent}
.lv.next{background:#ffd23a;color:#3a2a00;border-color:#e29a00;box-shadow:0 4px 0 #e29a00}
.lv.next span,.lv.next span i{color:#b97800}
.lv .duck{position:absolute;top:-6px;right:-6px;font-size:18px;line-height:1}
.lv:focus-visible{outline:3px solid #fffaf0;outline-offset:3px}
.levels .go{position:sticky;bottom:12px;margin-top:10px;width:314px;max-width:100%;height:52px;border:0;border-radius:26px;background:#ffd23a;color:#3a2a00;font:900 18px system-ui,sans-serif;box-shadow:0 4px 0 #e29a00,0 8px 18px #0006;cursor:pointer}
.levels .go:focus-visible{outline:3px solid #fffaf0;outline-offset:3px}
.levels .todo{margin:-2px 0 0;font-size:13px;font-weight:800;color:#a9d3dc}
.levels .note{margin:6px 0 0;font-size:13px;color:#a9d3dc}
</style>
</head>

</main>
