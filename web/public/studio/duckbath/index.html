<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123a48">
<meta name="description" content="물을 톡 치면 찰박! 물결이 고무 오리를 비누 거품 둥지로 밀어 줘요.">
<title>욕조 물결 오리</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#123a48;color:#fffaf0;font:16px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none}
main{max-width:460px;margin:0 auto;padding:0 0 24px}
@media (min-width:461px){main{padding:0 10px 24px}}
header{height:44px;display:flex;align-items:center;padding:0 8px 0 12px}
h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.01em}
h1 span{color:#ffd84a}
#game{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.g-canvas{display:block;margin:0 auto;border-radius:0;touch-action:none;outline:none}
.g-canvas:focus-visible{box-shadow:0 0 0 3px #ffd84a}
.g-overlay{position:absolute;inset:0;margin:auto;width:min(100%,440px);border:0;border-radius:14px;background:#123a48b8;color:#fffaf0;font:inherit;cursor:pointer;display:grid;place-content:center;gap:6px;text-align:center;padding:16px}
.g-overlay b{font-size:34px}
.g-overlay span{font-size:15px;color:#bfeaf2}
.g-overlay:focus-visible{outline:3px solid #ffd84a}
.ver{color:#6f9fab;font-size:12px;text-align:center;margin-top:10px}
.card{position:fixed;left:50%;top:0;z-index:5;transform:translateX(-50%);width:min(calc(var(--cw,390px) - 24px),360px);box-sizing:border-box;background:#0b2c39;border:2px solid #3e7f92;border-radius:20px;padding:16px;box-shadow:0 8px 24px #0006;color:#fffaf0;text-align:center}
.card.lose{border-color:#ffb3a8}
.card h2{margin:0 0 8px;font-size:22px;font-weight:900;line-height:1.25}
.card.win h2{font-size:34px;color:#ffd84a}
.card ul{list-style:none;margin:0 0 12px;padding:0;text-align:left}
.card li{font-size:15px;font-weight:700;margin:4px 0;display:flex;gap:8px;align-items:center}
.card li i{font-style:normal;font-size:20px;color:#ffd84a;width:22px;text-align:center}
.card li.todo{color:#a9d3dc}
.card li.todo i{color:#6f9fab}
.card li:first-child:empty{display:none}
.card .tip{margin:0 0 6px;font-size:15px;font-weight:700;color:#ffe9a8}
.card .why{margin:0 0 12px;font-size:15px;color:#a9d3dc}
.card .row{display:flex;gap:8px}
.card .btn{flex:1.5;min-height:52px;border:0;border-radius:26px;background:#ffd23a;color:#3a2a00;font:800 18px system-ui,sans-serif;box-shadow:0 4px 0 #e29a00;cursor:pointer}
.card .btn2{flex:1;min-height:44px;align-self:center;border:2px solid #2e6576;border-radius:22px;background:#1b4b5b;color:#fffaf0;font:800 16px system-ui,sans-serif;cursor:pointer}
.card button:focus-visible{outline:3px solid #ffd84a;outline-offset:2px}
.card .lnk{margin-top:8px;min-height:44px;border:0;background:none;color:#a9d3dc;font:700 15px system-ui,sans-serif;text-decoration:underline;cursor:pointer}
.levels{position:absolute;inset:0;z-index:4;background:#123a48f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
.levels h2{margin:0;font-size:26px;font-weight:900}
.levels .sum{margin:0 0 6px;font-size:18px;font-weight:800;color:#ffd84a}
.levels .grid{display:grid;grid-template-columns:repeat(4,72px);gap:12px}
.lv{width:72px;height:72px;border-radius:16px;border:2px solid #3e7f92;background:#1b4b5b;color:#fffaf0;font:800 22px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
.lv span{font-size:13px;color:#ffd84a;letter-spacing:1px}
.lv:disabled{opacity:.5;cursor:default}
.lv:disabled span{color:#a9d3dc;letter-spacing:0}
.lv.next{border-color:#ffd23a;box-shadow:0 0 0 3px #ffd23a55}
.lv:focus-visible{outline:3px solid #ffd84a;outline-offset:2px}
.levels .note{margin:6px 0 0;font-size:13px;color:#a9d3dc}
</style>
</head>
<body>
<main>
  <header><h1>🦆 욕조 물결 <span>오리</span></h1></header>
  <div id="game"></div>
  <p class="ver">스튜디오 빌드 M1 작업 중 (D005)</p>
</main>
