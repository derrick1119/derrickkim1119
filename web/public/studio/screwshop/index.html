<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2a20">
<meta name="description" content="나사를 톡 하면 뱅글뱅글 풀려 같은 색 상자로 쏙! 햄스터 목수의 장난감 공방.">
<title>나사 풀기 공방</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#3a2a20;color:#fff8ec;font:16px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none}
main{max-width:460px;margin:0 auto;padding:0 0 16px}
header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.01em}
h1 span{color:#ffc65c}
header small{color:#d8c3a5;font-size:12px;margin-right:4px}
.tg{display:flex;align-items:center;gap:4px}
.tg button{width:44px;height:44px;border:0;border-radius:22px;background:transparent;font-size:20px;cursor:pointer;padding:0}
.tg button:focus-visible{outline:3px solid #ffc65c}
#game{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.g-canvas{display:block;margin:0 auto;touch-action:none;outline:none}
.g-canvas:focus-visible{box-shadow:0 0 0 3px #ffc65c}
.g-overlay{position:absolute;inset:0;margin:auto;width:100%;border:0;background:#2a1c13d9;color:#fff8ec;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px}
.g-overlay em{font-style:normal;font-size:52px;line-height:1}
.g-overlay b{font-size:32px;font-weight:900}
.g-overlay ul{list-style:none;margin:4px 0;padding:0;text-align:left;max-width:330px}
.g-overlay li{font-size:15px;font-weight:700;margin:6px 0;word-break:keep-all}
.g-overlay li i{font-style:normal;color:#ffc65c}
.g-overlay strong{margin-top:6px;min-width:200px;padding:12px 24px;border-radius:28px;background:#ffc65c;color:#3a2a00;font-size:20px;font-weight:900;box-shadow:0 4px 0 #d58e1c}
.g-overlay span{font-size:14px;color:#d8c3a5;word-break:keep-all}
.g-overlay span.msg{font-size:17px;font-weight:800;color:#fff8ec}
.g-overlay span.best{color:#ffc65c;font-weight:800}
.g-overlay:focus-visible strong{outline:3px solid #fff8ec;outline-offset:3px}
</style>
</head>
<body>
<main>
  <header><h1>🔩 나사 풀기 <span>공방</span></h1><div class="tg"><small>빌드 M1′-S005</small><button id="buzz" type="button" aria-label="진동 켜고 끄기">📳</button><button id="sound" type="button" aria-label="소리 끄기">🔊</button></div></header>
  <div id="game"></div>
</main>
