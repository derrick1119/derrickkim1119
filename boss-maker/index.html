<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탄막 보스 메이커</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  /* 장난감 상자 같은 만화풍: 굵은 먹선, 납작한 원색, 눌리는 버튼. 밝은 로비가 밤하늘 아레나를 감싼다. */
  --sun:#ffc93c;
  --sun-deep:#f5ae1b;
  --ink:#2a1f3d;
  --ink-soft:#6b5f80;
  --paper:#fffaf0;
  --go:#5fe08a;
  --sky:#6ad1ff;
  --coral:#ff6b6b;
  --night:#2f2a66;
  --font-display:"Bagel Fat One","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --edge:3px solid var(--ink);
  --lip:0 4px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:var(--sun);
  background-image:radial-gradient(var(--sun-deep) 2.4px,transparent 3px);
  background-size:22px 22px;
  color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden;
  word-break:keep-all;overflow-wrap:anywhere;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0;font-weight:400}
img{display:block}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.bar{grid-row:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 4px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand img{width:46px;height:46px;flex:none}
h1{
  font:400 clamp(20px,5.4vw,29px)/1.1 var(--font-display);color:#fff;white-space:nowrap;
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink),0 4.5px 0 var(--ink);
}
.proto{font-size:12px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 9px;white-space:nowrap}
.views{display:flex;gap:6px;flex:none}
.views button{background:var(--paper);border:var(--edge);box-shadow:0 3px 0 var(--ink);padding:4px 13px;min-height:40px;font-size:16px}
.views button[aria-pressed="true"]{background:var(--sky);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

main{grid-row:2;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"stage sheet" "stage editor"}
.stage{grid-area:stage;min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:14px 16px 20px}
.fit{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.stagebox{position:relative;border-radius:16px;background:var(--night);box-shadow:0 0 0 3px var(--ink),0 5px 0 3px var(--ink)}
canvas{display:block;width:100%;height:100%;border-radius:16px}
.pv{position:absolute;left:6px;right:6px;bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 3px 3px 10px;font-size:12px;color:#fff;background:rgba(34,26,53,.74);border-radius:999px}
.pv button{background:var(--paper);color:var(--ink);border:0;border-radius:999px;min-height:26px;font-size:12px;padding:0 10px}
.overlay{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;background:rgba(34,26,53,.86);color:#fff}
.overlay h2{font:400 clamp(28px,8.5vw,44px)/1.15 var(--font-display);text-wrap:balance}
.overlay p{max-width:30ch}
.overlay .dim{color:#cfc6e6;font-size:13.5px}
.overlay .face{width:96px;height:96px}
.overlay .stars{font:400 40px/1.1 var(--font-display);letter-spacing:4px;color:var(--sun)}
.overlay .go{margin-top:10px;background:var(--sun);color:var(--ink);border-radius:999px;padding:8px 16px;box-shadow:0 4px 0 #b97a00}
.overlay .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px;color:var(--ink)}
.overlay .b{box-shadow:0 4px 0 #0f0a1c}
.playbar{display:none}

.b{background:var(--paper);border:var(--edge);box-shadow:var(--lip);padding:8px 14px;min-height:44px;transition:transform .05s,box-shadow .05s}
.b:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.b.primary{background:var(--go)}

.sheetwrap{grid-area:sheet;min-width:0;padding:14px 16px 4px 4px}
.sheet{border:var(--edge);border-radius:16px;box-shadow:var(--lip);background:var(--paper);overflow:hidden}
.cell{padding:8px 12px 10px;border-top:2px dashed rgba(42,31,61,.18);min-width:0}
.cell:first-child{border-top:0}
.lab{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:3px}
.who{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.who img{width:54px;height:54px}
#bossName{width:100%;background:#fff;border:2.5px solid var(--ink);border-radius:10px;font:400 18px/1.3 var(--font-display);padding:4px 8px}
.budget{display:flex;align-items:center;gap:8px}
.meter{flex:1;height:16px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--sun)}
#budgetNum{font:400 24px/1 var(--font-display);font-variant-numeric:tabular-nums}
.of{font-size:13px;color:var(--ink-soft)}
.share{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.share input,.import input{background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:7px 9px;min-width:0;font:13px ui-monospace,Menlo,Consolas,monospace}
.share .b{min-height:38px;padding:4px 12px;box-shadow:0 3px 0 var(--ink)}
.dim{color:var(--ink-soft);font-size:13px}
.opp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opp b{font:400 20px/1.3 var(--font-display)}
.tag{font-size:12px;background:var(--ink);color:#fff;border-radius:999px;padding:1px 9px;white-space:nowrap}
.scout{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.scout li{display:flex;align-items:center;gap:6px;min-height:30px}
.scout .n{font:400 17px/1 var(--font-display);width:14px}
.ico{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border:2.5px solid var(--ink);border-radius:11px;color:var(--ink)}
.ico.sm{width:30px;height:30px;border-radius:9px}
.ico.sm svg{width:18px;height:18px}
.coin{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;padding:0 6px;border-radius:999px;background:var(--sun);border:2.5px solid var(--ink);font:400 19px/1 var(--font-display);font-variant-numeric:tabular-nums}

.editor{grid-area:editor;min-width:0;min-height:0;overflow-y:auto;padding:12px 16px 22px 4px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tab{background:var(--paper);border:var(--edge);border-radius:14px;box-shadow:var(--lip);padding:6px 8px 7px;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;align-items:center}
.tab b{font:400 32px/1 var(--font-display);grid-row:span 2}
.tab .when{font-size:12.5px;color:var(--ink-soft)}
.chip{font-size:12px;justify-self:start;border-radius:999px;padding:0 7px;line-height:1.5;white-space:nowrap}
.chip.ok{background:var(--go)}
.chip.no{background:#ffe1dc;color:#a53030}
.chip.idle{background:#ece6f5;color:var(--ink-soft)}
.tab[aria-pressed="true"]{background:var(--sky);transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.tab[aria-pressed="true"] .when{color:var(--ink)}
.slots{display:grid;gap:12px;margin-top:14px}
.slot{background:var(--paper);border:var(--edge);border-radius:16px;box-shadow:var(--lip);padding:10px 12px 12px}
.slot header{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center}
.slot h3{font:400 18px/1.2 var(--font-display)}
.slot .nm p{font-size:13px;color:var(--ink-soft)}
.slot .x{background:var(--coral);border:2.5px solid var(--ink);border-radius:10px;font-size:13px;padding:4px 9px;min-height:36px}
.spec{font-size:13px;color:var(--ink-soft);margin:8px 0 2px;font-variant-numeric:tabular-nums}
.knob{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:8px;margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.5px;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--ink)}
.seg button{background:#fff;border:0;border-radius:0;padding:6px 4px;min-height:38px}
.seg button:focus-visible{outline-offset:-5px}
.seg button[aria-pressed="true"]{background:var(--sky)}
.seg button:disabled{opacity:1;color:#b3a9c6;background:#f1edf7}
.slot.add{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;text-align:left;font-size:16px;background:rgba(255,250,240,.6);border:3px dashed var(--ink);box-shadow:none}
.slot.add span{font-size:13px;color:var(--ink-soft)}
.palette{margin-top:12px;background:var(--paper);border:var(--edge);border-radius:16px;box-shadow:var(--lip);padding:10px}
.palette .head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:6px 8px}
.pick .ico{width:34px;height:34px;border-radius:9px}
.pick b{display:block;font:400 15px/1.2 var(--font-display)}
.pick span.r{display:block;font-size:12px;color:var(--ink-soft);line-height:1.3}
.pick .coin{min-width:32px;height:32px;font-size:16px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:end;margin-top:18px}
.tip img{width:58px;height:58px}
.tip p{position:relative;background:var(--paper);border:var(--edge);border-radius:14px;padding:8px 12px;font-size:13.5px;max-width:60ch}
.tip p::before{content:"";position:absolute;left:-8.5px;bottom:14px;width:12px;height:12px;background:var(--paper);border-left:var(--edge);border-bottom:var(--edge);transform:rotate(45deg)}
.sec{font:400 20px/1.2 var(--font-display);margin-bottom:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec small{font:400 13px var(--font-body);opacity:.78}
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.skillpick{display:grid;gap:2px;align-content:start;text-align:left;background:var(--paper);border:var(--edge);border-radius:14px;box-shadow:var(--lip);padding:8px 10px}
.skillpick b{font:400 17px/1.2 var(--font-display)}
.skillpick span{font-size:13px;color:var(--ink-soft);line-height:1.35}
.skillpick[aria-pressed="true"]{background:var(--sky);transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.skillpick[aria-pressed="true"] span{color:var(--ink)}
.big{width:100%;margin:16px 0 24px;min-height:58px;font:400 22px/1 var(--font-display);border-radius:16px;box-shadow:0 6px 0 var(--ink)}
.big:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.targets{display:grid;gap:10px}
.target{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 10px;align-items:center;text-align:left;background:var(--paper);border:var(--edge);border-radius:16px;box-shadow:var(--lip);padding:8px 12px}
.target img{width:48px;height:48px;grid-row:span 2}
.target b{font:400 19px/1.25 var(--font-display)}
.target .tag{grid-row:span 2}
.target .rec{grid-column:2;font-size:13px;color:var(--ink-soft)}
.target[aria-pressed="true"]{background:var(--sky)}
.target[aria-pressed="true"] .rec{color:var(--ink)}
.import{margin-top:18px}
.import label{font-size:13px;display:block;margin-bottom:4px}
.import .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.err{color:#a3222c;font-size:13px;min-height:1.3em;margin-top:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}

@media (max-width:860px){
  main{grid-template-columns:176px minmax(0,1fr);grid-template-rows:264px minmax(0,1fr);grid-template-areas:"stage sheet" "editor editor"}
  .stage{padding:10px 6px 18px 16px}
  .sheetwrap{padding:10px 16px 8px 8px;overflow-y:auto;min-height:0}
  .editor{padding:6px 16px 22px}
  .cell{padding:6px 10px 8px}
  .who{gap:8px}
  .who img{width:44px;height:44px}
  #bossName{font-size:16px}
  .scout{gap:4px}
  .scout li{min-height:26px}
  .ico.sm{width:26px;height:26px;border-radius:8px}
  .ico.sm svg{width:16px;height:16px}
}
@media (max-width:480px){
  .proto{display:none}
  .brand img{width:40px;height:40px}
  .skills{grid-template-columns:1fr}
  .skillpick{grid-template-columns:64px minmax(0,1fr);align-items:baseline}
}

body.playing{background:#221a35;background-image:none}
body.playing .bar,body.playing .sheetwrap,body.playing .editor{display:none}
body.playing main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"stage"}
body.playing .stage{padding:10px 10px 0;touch-action:none;user-select:none;-webkit-user-select:none}
body.playing .stagebox{box-shadow:0 0 0 3px #4a3f73}
body.playing canvas{cursor:none}
body.playing .pv{display:none}
body.playing .playbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 6px 14px;min-height:92px;width:100%;max-width:560px;margin:0 auto}
body.playing .playbar .b{box-shadow:0 4px 0 #0f0a1c}
body.playing button:focus-visible{outline-color:#fff}
#playHint{font-size:13px;color:#cfc6e6;text-align:center}
.skill{min-width:116px;min-height:62px;background:var(--sun);border:var(--edge);border-radius:16px;box-shadow:0 5px 0 #b97a00;font:400 20px/1.15 var(--font-display);padding:6px 12px}
.skill small{display:block;font:400 12px var(--font-body)}
.skill:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #b97a00}
@media (prefers-reduced-motion:no-preference){
  .overlay .go{animation:hop 1.1s ease-in-out infinite}
  @keyframes hop{50%{transform:translateY(-4px)}}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><img id="logo" alt="" width="46" height="46"><h1>탄막 보스 메이커</h1><span class="proto">프로토타입</span></div>
    <nav class="views" aria-label="화면 전환">
      <button type="button" id="tabWorkshop" aria-pressed="true">작업실</button>
      <button type="button" id="tabChallenge" aria-pressed="false">도전</button>
    </nav>
  </header>
  <main>
    <section class="stage" id="stage">
      <div class="fit" id="fit">
        <div class="stagebox" id="stagebox">
          <canvas id="arena" role="img" aria-label="보스 아레나"></canvas>
          <div class="pv" id="pv"><span id="pvLabel">미리보기</span><button type="button" id="pvToggle">멈춤</button></div>
          <div class="overlay" id="overlay" hidden></div>
        </div>
      </div>
      <div class="playbar">
        <button type="button" class="b" id="btnExit">나가기</button>
        <p id="playHint"></p>
        <button type="button" class="skill" id="skillBtn"></button>
      </div>
    </section>
    <section class="sheetwrap" id="sheetWorkshop" aria-label="내 보스 요약">
      <div class="sheet">
        <div class="cell"><div class="who"><img id="myAvatar" alt="" width="54" height="54"><div><label class="lab" for="bossName">보스 이름</label><input id="bossName" type="text" maxlength="12" autocomplete="off" spellcheck="false" placeholder="이름마다 색이 달라요"></div></div></div>
        <div class="cell"><span class="lab">코스트 예산</span><div class="budget"><div class="meter"><i id="budgetBar"></i></div><b id="budgetNum">0</b><span class="of">/ 100</span></div></div>
        <div class="cell"><span class="lab">공유 코드</span><div id="shareBox"></div></div>
      </div>
    </section>
    <section class="sheetwrap" id="sheetChallenge" aria-label="상대 정보" hidden></section>
    <section class="editor" id="editor"></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- 규칙 ---------- */
const W = 360, H = 540, TPS = 60, DT = 1 / TPS, TAU = Math.PI * 2;
const PHASE_TICKS = 600, EMIT_FROM = 0.7, EMIT_TO = 9.0;
const BOSS = { x: 180, y: 78 }, ZONE_Y = 150;
const PR = 3, PLAYER_SPEED = 520, MAX_BULLETS = 260, BUDGET = 100;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lv = (arr, n) => arr[n - 1];

const CARD = {
  r: { name: '원형 확산', role: '공간을 채워요', base: 8, sc: 3, dc: 4, tile: '#5fe0ff' },
  s: { name: '나선', role: '돌면서 쓸어내요', base: 10, sc: 3, dc: 4, tile: '#ffd23f' },
  a: { name: '조준탄', role: '멈춘 사람을 잡아요', base: 10, sc: 4, dc: 3, tile: '#ff6b6b' },
  h: { name: '유도탄', role: '계속 움직이게 해요', base: 14, sc: 4, dc: 5, tile: '#ff8fd0' },
  w: { name: '벽', role: '틈으로만 지나가요', base: 14, sc: 4, dc: 5, tile: '#efe6cf' },
  l: { name: '레이저', role: '길을 잘라요', base: 18, sc: 5, dc: 6, tile: '#ff9f1c' },
};
const ORDER = ['r', 's', 'a', 'h', 'w', 'l'];
const P = {
  r: { int: [1.5, 1.1, 0.8], n: [14, 20, 26], v: [70, 100, 135] },
  s: { int: 0.11, arms: [2, 3, 4], v: [75, 105, 140] },
  a: { int: 1.05, fan: [1, 3, 5], v: [160, 220, 290] },
  h: { int: [2.6, 1.8, 1.25], v: [62, 86, 112], life: 4.6 },
  w: { int: [3.4, 2.6, 1.9], gap: [92, 78, 66], v: [70, 100, 135] },
  l: { int: [2.8, 2.1, 1.6], tele: [0.9, 0.7, 0.5], act: 0.5, w: 40 },
};
const SKILL = {
  bomb: { name: '폭탄', desc: '화면의 탄을 모두 지워요' },
  slow: { name: '슬로우', desc: '3초간 보스의 시간이 느려져요' },
  dash: { name: '대시', desc: '1초간 무적이 돼요' },
};

const cardCost = c => CARD[c.t].base + (c.s - 1) * CARD[c.t].sc + (c.d - 1) * CARD[c.t].dc;
const bossCost = b => b.phases.reduce((n, ph) => n + ph.reduce((m, c) => m + cardCost(c), 0), 0);
function specLine(c) {
  const p = P[c.t];
  switch (c.t) {
    case 'r': return `${lv(p.n, c.d)}발씩 ${lv(p.int, c.d)}초마다 · 탄속 ${lv(p.v, c.s)}`;
    case 's': return `${lv(p.arms, c.d)}줄기 회전 · 탄속 ${lv(p.v, c.s)}`;
    case 'a': return `${lv(p.fan, c.d)}갈래 조준 · 탄속 ${lv(p.v, c.s)}`;
    case 'h': return `${lv(p.int, c.d)}초마다 1발 · 탄속 ${lv(p.v, c.s)} · ${p.life}초 추적`;

  const s = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  let inner = '';
  if (t === 'r') {
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; inner += `<circle cx="${(10 + 6.5 * Math.cos(a)).toFixed(1)}" cy="${(10 + 6.5 * Math.sin(a)).toFixed(1)}" r="1.6" fill="currentColor"/>`; }
    inner += `<circle cx="10" cy="10" r="1.6" ${s}/>`;
  } else if (t === 's') {
    let d = '';
    for (let i = 0; i <= 40; i++) { const a = i * 0.36, r = 0.8 + i * 0.19; d += (i ? 'L' : 'M') + (10 + r * Math.cos(a)).toFixed(1) + ' ' + (10 + r * Math.sin(a)).toFixed(1); }
    inner = `<path d="${d}" ${s}/>`;
  } else if (t === 'a') inner = `<circle cx="10" cy="14" r="4" ${s}/><path d="M10 2v9M7 8l3 3 3-3" ${s}/>`;
  else if (t === 'h') inner = `<path d="M4 3c0 8 4 12 11 12M12 12l3 3-3 3" ${s}/>`;
  else if (t === 'w') inner = [1, 5, 12, 16].map(x => `<rect x="${x}" y="8" width="3" height="4" fill="currentColor"/>`).join('') + `<path d="M10 3v4M10 13v4" ${s} stroke-dasharray="1.5 2"/>`;
  else inner = `<rect x="7.5" y="2" width="5" height="16" fill="currentColor"/><path d="M4 2v16M16 2v16" ${s} stroke-dasharray="2 2.5"/>`;
  return `<svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true">${inner}</svg>`;
}
const stars = n => '★'.repeat(n) + '☆'.repeat(3 - n);
function recText(rec) {
  if (!rec || !rec.tries) return '아직 도전 안 함';
  return `도전 ${rec.tries} · 클리어 ${rec.clears}` + (rec.best ? ` · 최고 ${stars(rec.best)}` : '');
}
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- 장면과 플레이 ---------- */
let scene = { kind: 'idle', boss: SAMPLES[0].boss, sim: null, running: false };
let play = null, acc = 0, pulse = 0, shake = 0, banner = null, laughUntil = 0;
const fx = [];
const input = { tx: W / 2, ty: 462, skill: false, dragId: null, lx: 0, ly: 0 };
const keys = {};

function rebuildScene() {
  if (play) return;
  fx.length = 0; banner = null;
  if (state.view === 'workshop') {
    const sim = makeSim(state.boss, { phases: [state.phase], dummy: true });
    if (!state.previewOn) { for (let i = 0; i < 270; i++) stepSim(sim, null); sim.ev.length = 0; }
    scene = { kind: 'preview', sim, running: state.previewOn };
  } else scene = { kind: 'idle', boss: targets()[state.target].boss, sim: null, running: false };
}
function startPlay(cfg) {

}
const face = mood => `<img class="face" src="${avatar(play.boss, mood)}" alt="" width="96" height="96">`;
function newRun() {
  const verify = play.mode === 'verify';
  const sim = makeSim(play.boss, verify ? { phases: [play.phase], hearts: 1 } : { hearts: 3, skill: play.skill });
  scene = { kind: 'play', sim, running: false, state: 'ready' };
  input.tx = sim.p.x; input.ty = sim.p.y; input.skill = false; input.dragId = null;
  acc = 0; fx.length = 0; banner = null; shake = 0; laughUntil = 0;
  const ctl = COARSE ? '화면 아무 곳이나 끌어서 움직여요.' : '마우스를 움직이거나 방향키로 움직여요. Shift는 저속.';
  const skl = verify ? '' : COARSE ? ' 스킬은 오른쪽 아래 버튼.' : ' 스킬은 클릭이나 Space.';
  const go = `<p class="go">${COARSE ? '화면을 누르면 시작' : '클릭하거나 Space를 누르면 시작'}</p>`;
  overlay.innerHTML = verify
    ? `${face('idle')}<h2>${play.phase + 1}페이즈 검증</h2><p>10초 노히트 · ${play.streak + 1}/2회차 · 스킬 없음</p><p class="dim">${ctl}</p>${go}`
    : `${face('idle')}<h2>${esc(play.boss.name)}</h2><p>30초 버티기 · 하트 3개</p><p class="dim">${ctl}${skl}</p>${go}`;
  overlay.hidden = false;
  $('#playHint').textContent = verify ? '한 번이라도 맞으면 연속 기록이 0으로 돌아가요.' : COARSE ? '아래 빈 곳을 끌면 손가락이 탄을 가리지 않아요.' : 'Esc로 나가요.';

}
function updateSkillBtn() {
  const btn = $('#skillBtn'), sim = scene.sim;
  if (!play || !sim || !sim.skill) { btn.innerHTML = '스킬 없음<small>검증 중</small>'; btn.disabled = true; return; }
  btn.disabled = sim.skillUsed;
  btn.innerHTML = `${SKILL[sim.skill].name}<small>${sim.skillUsed ? '사용함' : '한 번 쓸 수 있어요'}</small>`;
}
function begin() {
  scene.state = 'running'; scene.running = true; overlay.hidden = true;
  banner = { text: `${scene.sim.phases[0] + 1}페이즈`, t: performance.now() / 1000 };
}
function finish() {
  const sim = scene.sim, win = sim.over === 'win';
  scene.running = false; scene.state = 'over';
  let h = '';
  if (play.mode === 'verify') {
    if (win) {
      play.streak++;
      if (play.streak >= 2) {
        state.verified[play.phase] = phaseKey(state.boss.phases[play.phase]); save();
        h = `${face('dizzy')}<h2>검증 완료</h2><p>${play.phase + 1}페이즈가 등록됐어요.</p><div class="btns"><button type="button" class="b primary" data-ov="exit">작업실로</button></div>`;
      } else h = `${face('dizzy')}<h2>노히트 1/2</h2><p>한 번 더 깨면 이 페이즈가 등록돼요.</p><div class="btns"><button type="button" class="b primary" data-ov="again">2회차 시작</button><button type="button" class="b" data-ov="exit">그만두기</button></div>`;
    } else {
      play.streak = 0;
      h = `${face('laugh')}<h2>피격</h2><p>${sim.failAt.sec.toFixed(1)}초에서 맞았어요. 연속 기록이 0으로 돌아가요.</p><div class="btns"><button type="button" class="b primary" data-ov="again">다시</button><button type="button" class="b" data-ov="exit">그만두기</button></div>`;
    }
  } else {
    if (play.mode === 'challenge') {
      const rec = state.records[play.code] || (state.records[play.code] = { tries: 0, clears: 0, best: 0 });
      rec.tries++; if (win) { rec.clears++; rec.best = Math.max(rec.best, sim.hearts); }
      save();
    }
    const back = play.mode === 'test' ? '작업실로' : '나가기';
    h = win
      ? `${face('dizzy')}<h2>클리어</h2><p class="stars" aria-label="별 ${sim.hearts}개">${stars(sim.hearts)}</p><p>${sim.hits ? `${sim.hits}번 맞고 버텼어요.` : '한 번도 안 맞았어요.'}</p><div class="btns"><button type="button" class="b primary" data-ov="again">한 판 더</button><button type="button" class="b" data-ov="exit">${back}</button></div>`
      : `${face('laugh')}<h2>격파 실패</h2><p>${sim.failAt.phase + 1}페이즈 ${sim.failAt.sec.toFixed(1)}초에서 쓰러졌어요.</p><div class="btns"><button type="button" class="b primary" data-ov="again">다시 도전</button><button type="button" class="b" data-ov="exit">${back}</button></div>`;
  }
  overlay.innerHTML = h; overlay.hidden = false;
  const first = overlay.querySelector('button'); if (first) first.focus();

function exitPlay() {
  play = null;
  document.body.classList.remove('playing');
  overlay.hidden = true;
  for (const k in keys) keys[k] = false;
  renderAll(); rebuildScene();
}
overlay.addEventListener('click', e => {
  const b = e.target.closest('[data-ov]'); if (!b) return;
  if (b.dataset.ov === 'again') newRun(); else exitPlay();
});
$('#btnExit').addEventListener('click', exitPlay);
$('#skillBtn').addEventListener('pointerdown', e => { e.preventDefault(); if (scene.state === 'running') input.skill = true; });
$('#skillBtn').addEventListener('click', () => { if (scene.state === 'running') input.skill = true; });

function mouseTarget(e) {
  const r = canvas.getBoundingClientRect();
  input.tx = clamp((e.clientX - r.left) / r.width * W, 0, W);
  input.ty = clamp((e.clientY - r.top) / r.height * H, 0, H);
}
stage.addEventListener('pointerdown', e => {
  if (!play || e.target.closest('button')) return;
  e.preventDefault();
  if (scene.state === 'ready') { begin(); if (e.pointerType === 'mouse') { mouseTarget(e); return; } }
  if (scene.state !== 'running') return;
  if (e.pointerType === 'mouse') { mouseTarget(e); input.skill = true; }
  else if (input.dragId === null) { input.dragId = e.pointerId; input.lx = e.clientX; input.ly = e.clientY; }
});
window.addEventListener('pointermove', e => {
  if (!play || scene.state !== 'running') return;
  if (e.pointerType === 'mouse') mouseTarget(e);
  else if (e.pointerId === input.dragId) {
    const p = scene.sim.p, k = 1.15 / view.css;
    input.tx = clamp(clamp(input.tx, p.x - 60, p.x + 60) + (e.clientX - input.lx) * k, 8, W - 8);
    input.ty = clamp(clamp(input.ty, p.y - 60, p.y + 60) + (e.clientY - input.ly) * k, ZONE_Y + 10, H - 8);
    input.lx = e.clientX; input.ly = e.clientY;
  }
});
const dropDrag = e => { if (e.pointerId === input.dragId) input.dragId = null; };
window.addEventListener('pointerup', dropDrag);
window.addEventListener('pointercancel', dropDrag);
stage.addEventListener('contextmenu', e => { if (play) e.preventDefault(); });

const KEYMAP = { ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R', ArrowUp: 'U', KeyW: 'U', ArrowDown: 'D', KeyS: 'D', ShiftLeft: 'S', ShiftRight: 'S' };
window.addEventListener('keydown', e => {
  if (!play) return;
  if (e.code === 'Escape') { exitPlay(); return; }
  if (scene.state === 'over') return;
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (scene.state === 'ready') begin(); else if (e.code === 'Space') input.skill = true;
    return;
  }
  const k = KEYMAP[e.code];
  if (k) { keys[k] = true; if (k !== 'S') e.preventDefault(); }
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function applyKeys(sim) {
  const vx = (keys.R ? 1 : 0) - (keys.L ? 1 : 0), vy = (keys.D ? 1 : 0) - (keys.U ? 1 : 0);
  if (!vx && !vy) return;
  const n = Math.hypot(vx, vy), sp = (keys.S ? 110 : 250) * DT;
  input.tx = clamp(sim.p.x + vx / n * sp, 8, W - 8);
  input.ty = clamp(sim.p.y + vy / n * sp, ZONE_Y + 10, H - 8);
}

function drain(sim, now) {
  for (const e of sim.ev) {
    if (e.k === 'fire') pulse = 1;
    else if (e.k === 'puff') { if (fx.length < 140) fx.push({ k: 'puff', x: e.x, y: e.y, t: now }); }
    else if (e.k === 'hit') { fx.push({ k: 'hit', x: e.x, y: e.y, t: now }); laughUntil = now + 0.9; if (!RM) shake = 10; }
    else if (e.k === 'bomb') fx.push({ k: 'bomb', x: e.x, y: e.y, t: now });
    else if (e.k === 'phase') banner = { text: `${sim.phases[sim.pi] + 1}페이즈`, t: now };
    else if (e.k === 'skill') updateSkillBtn();
  }
  sim.ev.length = 0;
}

/* ---------- 그리기 ---------- */
function fit() {
  const r = fitEl.getBoundingClientRect();
  if (r.width < 20 || r.height < 20) return;
  const s = Math.min(r.width / W, r.height / H), cw = Math.floor(W * s), ch = Math.floor(H * s);
  box.style.width = cw + 'px'; box.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  view.scale = canvas.width / W; view.css = cw / W;
  paintBg();
}
function paintBg() {
  const cv = document.createElement('canvas'); cv.width = canvas.width; cv.height = canvas.height;
  const g = cv.getContext('2d');
  g.setTransform(view.scale, 0, 0, view.scale, 0, 0);
  g.fillStyle = C.night; g.fillRect(0, 0, W, H);
  g.fillStyle = C.star;
  for (let i = 0; i < 44; i++) {
    const x = (i * 97 + 31) % W, y = ZONE_Y + 18 + (i * 193 + 57) % (H - ZONE_Y - 26);
    g.beginPath(); g.arc(x, y, 1 + (i % 3) * 0.6, 0, TAU); g.fill();
  }
  for (let i = 0; i < 6; i++) {
    const x = (i * 151 + 60) % W, y = ZONE_Y + 40 + (i * 233 + 90) % (H - ZONE_Y - 70), r = 5 + (i % 2) * 2;
    g.beginPath(); g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r, y); g.quadraticCurveTo(x, y, x, y + r); g.quadraticCurveTo(x, y, x - r, y); g.quadraticCurveTo(x, y, x, y - r); g.fill();
  }
  const cy = ZONE_Y - 16;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(W, 0); g.lineTo(W, cy);
  for (let x = W; x > 0; x -= 40) g.arc(x - 20, cy, 20, 0, Math.PI, false);
  g.closePath(); g.fillStyle = C.cloud; g.fill();
  g.beginPath(); g.moveTo(W, cy);
  for (let x = W; x > 0; x -= 40) g.arc(x - 20, cy, 20, 0, Math.PI, false);
  g.strokeStyle = 'rgba(20,14,40,.5)'; g.lineWidth = 2.5; g.lineJoin = 'round'; g.stroke();
  g.fillStyle = '#fff1b8'; g.beginPath(); g.arc(318, 70, 15, 0, TAU); g.fill();
  g.fillStyle = C.cloud; g.beginPath(); g.arc(311, 65, 13, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,.07)'; g.beginPath(); g.arc(BOSS.x, BOSS.y + 8, 54, 0, TAU); g.fill();
  bgCache = cv;
}
function otext(g, text, x, y, fill, lw) {
  g.lineJoin = 'round'; g.lineWidth = lw; g.strokeStyle = INK; g.strokeText(text, x, y);
  g.fillStyle = fill; g.fillText(text, x, y);
}
function drawLasers(g, sim, now) {
  for (const l of sim.lasers) {
    const x0 = l.x - l.w / 2;
    if (l.t < l.tele) {
      const q = l.t / l.tele;
      g.fillStyle = `rgba(255,159,28,${(0.1 + 0.22 * q).toFixed(3)})`; g.fillRect(x0, 0, l.w, H);
      g.strokeStyle = 'rgba(255,243,166,.95)'; g.lineWidth = 2; g.setLineDash([8, 6]);
      g.beginPath(); g.moveTo(x0, 0); g.lineTo(x0, H); g.moveTo(x0 + l.w, 0); g.lineTo(x0 + l.w, H); g.stroke(); g.setLineDash([]);
      const s = 1 + (RM ? 0 : 0.12 * Math.sin(now * 22));
      g.save(); g.translate(l.x, ZONE_Y + 30); g.scale(s, s); g.lineJoin = 'round';
      g.beginPath(); g.moveTo(0, -12); g.lineTo(12, 9); g.lineTo(-12, 9); g.closePath();
      g.fillStyle = C.sun; g.fill(); g.strokeStyle = INK; g.lineWidth = 2.5; g.stroke();
      g.fillStyle = INK; g.fillRect(-1.4, -5, 2.8, 8); g.beginPath(); g.arc(0, 5.6, 1.6, 0, TAU); g.fill();
      g.restore();
    } else {
      g.fillStyle = INK; g.fillRect(x0 - 2.5, 0, l.w + 5, H);
      g.fillStyle = C.bolt; g.fillRect(x0, 0, l.w, H);
      g.fillStyle = C.boltCore; g.fillRect(l.x - l.w * 0.3, 0, l.w * 0.6, H);
      g.fillStyle = '#fff'; g.fillRect(l.x - l.w * 0.12, 0, l.w * 0.24, H);
    }
  }
}
function drawBullets(g, sim) {
  const B = sim.bullets;
  const orbs = (kind, color) => {
    g.fillStyle = INK; g.beginPath();
    for (const b of B) if (b.k === kind) { g.moveTo(b.x + b.r + 1.6, b.y); g.arc(b.x, b.y, b.r + 1.6, 0, TAU); }
    g.fill();
    g.fillStyle = color; g.beginPath();
    for (const b of B) if (b.k === kind) { g.moveTo(b.x + b.r, b.y); g.arc(b.x, b.y, b.r, 0, TAU); }
    g.fill();
    g.fillStyle = '#fff'; g.beginPath();
    for (const b of B) if (b.k === kind) { const hx = b.x - b.r * 0.32, hy = b.y - b.r * 0.32, hr = b.r * 0.3; g.moveTo(hx + hr, hy); g.arc(hx, hy, hr, 0, TAU); }
    g.fill();
  };
  orbs('r', C.cyan);
  orbs('s', C.sun);
  g.fillStyle = INK; for (const b of B) if (b.k === 'w') g.fillRect(b.x - 7.5, b.y - 7.5, 15, 15);
  g.fillStyle = C.stone; for (const b of B) if (b.k === 'w') g.fillRect(b.x - 5.6, b.y - 5.6, 11.2, 11.2);
  g.fillStyle = C.stone2; for (const b of B) if (b.k === 'w') g.fillRect(b.x - 5.6, b.y + 2.4, 11.2, 3.2);
  g.lineCap = 'round'; g.beginPath();
  for (const b of B) if (b.k === 'a') { const sp = Math.hypot(b.vx, b.vy), ux = b.vx / sp, uy = b.vy / sp; g.moveTo(b.x - ux * 8, b.y - uy * 8); g.lineTo(b.x + ux * 2, b.y + uy * 2); }
  g.strokeStyle = INK; g.lineWidth = 10; g.stroke();
  g.strokeStyle = C.coral; g.lineWidth = 6.4; g.stroke();
  g.fillStyle = '#fff'; g.beginPath();
  for (const b of B) if (b.k === 'a') { const sp = Math.hypot(b.vx, b.vy), hx = b.x + b.vx / sp * 1.5, hy = b.y + b.vy / sp * 1.5; g.moveTo(hx + 1.5, hy); g.arc(hx, hy, 1.5, 0, TAU); }
  g.fill();
  g.lineCap = 'butt'; g.lineJoin = 'round';
  for (const b of B) if (b.k === 'h') {
    g.save(); g.translate(b.x, b.y); g.rotate(b.a);
    g.beginPath(); g.moveTo(-15, 0); g.quadraticCurveTo(-6, -8.5, 2, -8.5); g.arc(2, 0, 8.5, -Math.PI / 2, Math.PI / 2); g.quadraticCurveTo(-6, 8.5, -15, 0); g.closePath();
    g.fillStyle = C.pink; g.fill(); g.strokeStyle = INK; g.lineWidth = 2; g.stroke();
    for (const sy of [-3.3, 3.3]) { g.fillStyle = '#fff'; g.beginPath(); g.arc(4, sy, 2.5, 0, TAU); g.fill(); g.fillStyle = INK; g.beginPath(); g.arc(5, sy, 1.3, 0, TAU); g.fill(); }
    g.restore();
  }
}
function drawPlayer(g, sim, now) {
  const p = sim.p;
  if (!sim.dummy) {
    const dx = input.tx - p.x, dy = input.ty - p.y;
    if (dx * dx + dy * dy > 100) { g.strokeStyle = 'rgba(141,255,122,.6)'; g.lineWidth = 1.5; g.beginPath(); g.arc(input.tx, input.ty, 5, 0, TAU); g.stroke(); }
  }
  g.globalAlpha = sim.dummy ? 0.7 : p.inv > 0 && Math.floor(p.inv / 5) % 2 ? 0.35 : 1;
  g.lineJoin = 'round';
  g.fillStyle = 'rgba(141,255,122,.2)'; g.beginPath(); g.arc(p.x, p.y, 15, 0, TAU); g.fill();
  const flap = RM ? 0 : Math.sin(now * 34) * 0.4;
  for (const sg of [-1, 1]) {
    g.save(); g.translate(p.x + sg * 5, p.y - 3); g.rotate(sg * (0.45 + flap));
    g.beginPath(); g.ellipse(sg * 7, -3, 8, 4.5, 0, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,.92)'; g.fill(); g.strokeStyle = INK; g.lineWidth = 1.6; g.stroke(); g.restore();
  }
  g.beginPath(); g.arc(p.x, p.y, 8.5, 0, TAU); g.fillStyle = C.me; g.fill(); g.strokeStyle = INK; g.lineWidth = 2.2; g.stroke();
  g.fillStyle = INK; g.beginPath(); g.arc(p.x - 3.2, p.y - 4.6, 1.5, 0, TAU); g.arc(p.x + 3.2, p.y - 4.6, 1.5, 0, TAU); g.fill();
  g.beginPath(); g.arc(p.x, p.y + 0.5, 3.1, 0, TAU); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 1.5; g.stroke();
  g.globalAlpha = 1;
  if (sim.dash > 0) { g.lineCap = 'round'; g.strokeStyle = INK; g.lineWidth = 6; g.beginPath(); g.arc(p.x, p.y, 18, -Math.PI / 2, -Math.PI / 2 + TAU * sim.dash / 60); g.stroke(); g.strokeStyle = C.sun; g.lineWidth = 3; g.stroke(); g.lineCap = 'butt'; }
}
function drawFx(g, now) {
  let n = 0;
  for (const f of fx) {
    const a = now - f.t, life = f.k === 'puff' ? 0.26 : 0.5;
    if (a >= life) continue;
    const q = a / life;
    if (f.k === 'puff') { g.strokeStyle = `rgba(255,255,255,${(0.8 * (1 - q)).toFixed(3)})`; g.lineWidth = 2; g.beginPath(); g.arc(f.x, f.y, 3 + q * 10, 0, TAU); g.stroke(); }
    else {
      const r = f.k === 'hit' ? 12 + q * 90 : 20 + q * 520;
      g.globalAlpha = 1 - q;
      g.strokeStyle = INK; g.lineWidth = f.k === 'hit' ? 8 : 10; g.beginPath(); g.arc(f.x, f.y, r, 0, TAU); g.stroke();
      g.strokeStyle = f.k === 'hit' ? C.coral : C.sun; g.lineWidth = f.k === 'hit' ? 4 : 6; g.stroke();
      g.globalAlpha = 1;
    }
    fx[n++] = f;
  }
  fx.length = n;
}
function heart(g, x, y, s) {
  g.beginPath(); g.moveTo(x, y + s * 0.3);
  g.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  g.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
  g.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  g.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
  g.closePath();
}
function pill(g, x, y, w, h) {
  const r = h / 2;
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.arc(x + w - r, y + r, r, -Math.PI / 2, Math.PI / 2); g.lineTo(x + r, y + h); g.arc(x + r, y + r, r, Math.PI / 2, Math.PI * 1.5); g.closePath();
}
function drawHud(g, sim) {
  g.fillStyle = 'rgba(34,26,53,.6)'; g.fillRect(0, 0, W, 33);
  g.textBaseline = 'middle'; g.lineJoin = 'round';
  if (play.mode === 'verify') { g.font = '400 13px ' + FB; g.textAlign = 'left'; otext(g, `노히트 ${Math.min(2, play.streak + (scene.state === 'over' ? 0 : 1))}/2`, 10, 17, C.sun, 4); }
  else for (let i = 0; i < 3; i++) {
    heart(g, 19 + i * 20, 9, 15);
    g.fillStyle = i < sim.hearts ? C.coral : '#4a3f73'; g.fill(); g.strokeStyle = INK; g.lineWidth = 2.5; g.stroke();
  }
  const segs = sim.phases.length, x0 = 92, x1 = 300, gap = 5, sw = (x1 - x0 - gap * (segs - 1)) / segs;
  for (let s = 0; s < segs; s++) {
    const x = x0 + s * (sw + gap), f = s < sim.pi ? 1 : s === sim.pi ? sim.ptick / PHASE_TICKS : 0;
    pill(g, x, 11, sw, 11); g.fillStyle = '#4a3f73'; g.fill();
    if (f > 0) { g.save(); g.clip(); g.fillStyle = C.sun; g.fillRect(x, 11, sw * f, 11); g.restore(); }
    pill(g, x, 11, sw, 11); g.strokeStyle = INK; g.lineWidth = 2.5; g.stroke();
  }
  const remain = Math.max(0, ((segs - sim.pi) * PHASE_TICKS - sim.ptick) / TPS);
  g.font = '400 17px ' + FD; g.textAlign = 'right'; otext(g, remain.toFixed(1), 352, 18, '#fff', 4);
  if (sim.slow > 0) { g.font = '400 14px ' + FB; g.textAlign = 'center'; otext(g, '슬로우', W / 2, 46, C.sun, 4); }
}
function render(now) {
  const g = ctx, sim = scene.sim;
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (bgCache) g.drawImage(bgCache, 0, 0);
  let ox = 0, oy = 0;
  if (shake > 0) { ox = Math.sin(shake * 2.7) * shake * 0.5; oy = Math.cos(shake * 3.1) * shake * 0.4; shake--; }
  g.setTransform(view.scale, 0, 0, view.scale, ox * view.scale, oy * view.scale);
  if (sim) drawLasers(g, sim, now);
  const boss = sim ? sim.boss : scene.boss;
  let mood = 'idle';
  if (scene.kind === 'play') { if (sim.over === 'win') mood = 'dizzy'; else if (sim.over === 'lose' || now < laughUntil) mood = 'laugh'; }
  drawGoblin(g, BOSS.x, BOSS.y + 5, 1, { skin: SKINS[skinIndex(boss)], mood, pulse, t: now, still: RM, shadow: true });
  if (sim) { drawBullets(g, sim); drawPlayer(g, sim, now); }
  drawFx(g, now);
  if (scene.kind === 'play') drawHud(g, sim);
  if (scene.kind === 'idle') {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '400 32px ' + FD; otext(g, scene.boss.name, W / 2, 200, '#fff', 7);
    g.font = '400 14px ' + FB; g.fillStyle = '#d8d0f0'; g.fillText('탄막은 들어가 봐야 알 수 있어요', W / 2, 232);
  }
  if (banner) {
    const a = now - banner.t;
    if (a < 0.9) {
      const s = RM ? 1 : 1 + 0.5 * Math.max(0, 1 - a / 0.14);
      g.save(); g.translate(W / 2, 300); g.scale(s, s); g.globalAlpha = Math.min(1, (0.9 - a) / 0.3);
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '400 48px ' + FD; otext(g, banner.text, 0, 0, '#fff', 9);
      g.restore(); g.globalAlpha = 1;
    } else banner = null;
  }
}
let last = 0;
function frame(ms) {
  const now = ms / 1000, dtm = Math.min(0.1, now - last); last = now;
  pulse = Math.max(0, pulse - dtm * 6);
  const sc = scene;
  if (sc.sim && sc.running) {
    acc += dtm; let n = 0;
    while (acc >= DT && n < 6) {
      if (sc.kind === 'play') applyKeys(sc.sim);
      stepSim(sc.sim, input); input.skill = false;
      drain(sc.sim, now);
      acc -= DT; n++;
      if (sc.sim.over) { finish(); break; }
    }
    if (n === 6) acc = 0;
  }
  render(now);
  requestAnimationFrame(frame);
}

/* ---------- 시작 ---------- */
function readHash() {
  const h = location.hash.replace(/^#/, '');
  if (!/^bm1-/i.test(h)) return false;
  const r = addImported(h);
  if (r.error) return false;
  state.view = 'challenge';
  return true;
}
function start(data) {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { /* 저장소 없이 시작 */ }
  applySaved(data && data.boss ? data : saved);
  if (RM) state.previewOn = false;
  readHash();
  $('#logo').src = avatar(MASCOT);
  $('#bossName').value = state.boss.name;
  renderAll();
  new ResizeObserver(fit).observe(fitEl);
  fit(); rebuildScene();
  requestAnimationFrame(ms => { last = ms / 1000; requestAnimationFrame(frame); });
}
window.addEventListener('hashchange', () => { if (!play && readHash()) { save(); renderAll(); rebuildScene(); } });
window.__bm = { makeSim, stepSim, cloneSim, encode, decode, bossCost, SAMPLES, W, H, ZONE_Y };
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(snap);
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
