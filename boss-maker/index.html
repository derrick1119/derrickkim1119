<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탄막 보스 메이커</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 청사진 한 장: 왼쪽은 아레나, 오른쪽은 표제란과 부품표. 좁은 화면에서는 아레나 옆에 표제란, 아래에 부품표. */
  --paper:#1c4a9f;
  --paper-deep:#143a82;
  --ink:#f3efe2;
  --ink-dim:#b7c7ea;
  --line:rgba(243,239,226,.26);
  --line-strong:rgba(243,239,226,.6);
  --grid:rgba(243,239,226,.05);
  --hot:#ff7a45;
  --amber:#ffc53d;
  --pink:#ff6fb0;
  --ok:#8fe8b8;
  --font-display:"Black Han Sans","Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden;
  word-break:keep-all;overflow-wrap:anywhere;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border-radius:2px}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.bar{grid-row:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--paper-deep)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
h1{font:400 clamp(18px,5vw,23px)/1.1 var(--font-display);white-space:nowrap}
.proto{font-size:11px;color:var(--ink-dim);border:1px solid var(--line);padding:1px 6px;white-space:nowrap}
.views{display:flex;border:1px solid var(--line-strong);flex:none}
.views button{background:none;border:0;border-radius:0;padding:6px 14px;min-height:36px}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--paper-deep);font-weight:600}

main{grid-row:2;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,420px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"stage sheet" "stage editor"}
.stage{grid-area:stage;min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:16px}
.fit{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.stagebox{position:relative;box-shadow:0 0 0 1px var(--line-strong)}
canvas{display:block;width:100%;height:100%}
.pv{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 6px;font-size:11px;color:var(--ink-dim);background:rgba(13,42,99,.72)}
.pv button{background:none;border:1px solid var(--line);min-height:24px;font-size:11px;padding:0 7px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;background:rgba(13,42,99,.84)}
.overlay h2{font:400 clamp(26px,8vw,40px)/1.15 var(--font-display);text-wrap:balance}
.overlay p{max-width:30ch}
.overlay .dim{color:var(--ink-dim);font-size:13px}
.overlay .stars{font-size:34px;letter-spacing:4px;color:var(--amber);line-height:1.1}
.overlay .go{margin-top:10px;font-weight:600;border:1px solid var(--line-strong);padding:8px 14px}
.overlay .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.playbar{display:none}

.b{background:transparent;border:1px solid var(--line-strong);padding:9px 14px;min-height:40px}
.b.primary{background:var(--ink);color:var(--paper-deep);border-color:var(--ink);font-weight:600}

.sheetwrap{grid-area:sheet;min-width:0;border-left:1px solid var(--line);padding:16px 16px 0}
.sheet{border:1px solid var(--line-strong);background:rgba(10,30,80,.22)}
.cell{padding:8px 10px 10px;border-top:1px solid var(--line);min-width:0}
.cell:first-child{border-top:0}
.lab{display:block;font-size:11px;letter-spacing:.04em;color:var(--ink-dim);margin-bottom:4px}
#bossName{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line-strong);border-radius:0;font:400 20px/1.3 var(--font-display);padding:2px 0}
.budget{display:flex;align-items:center;gap:8px}
.meter{flex:1;height:8px;border:1px solid var(--line-strong);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--amber)}
#budgetNum{font:400 22px/1 var(--font-display);font-variant-numeric:tabular-nums}
.of{font-size:12px;color:var(--ink-dim)}
.lamps{display:flex;gap:6px;flex-wrap:wrap}
.lamp{font-size:12px;border:1px solid var(--line);padding:2px 8px;font-variant-numeric:tabular-nums}
.lamp.on{border-color:var(--ok);color:var(--ok)}
.share{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.share input,.import input{background:rgba(10,30,80,.4);border:1px solid var(--line-strong);border-radius:2px;padding:7px 9px;min-width:0;font-size:13px}
.share .b{min-height:36px;padding:6px 12px}
.dim{color:var(--ink-dim);font-size:12.5px}
.opp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opp b{font:400 20px/1.3 var(--font-display)}
.tag{font-size:11px;border:1px solid var(--line);padding:1px 6px;white-space:nowrap}
.scout{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.scout li{display:flex;align-items:center;gap:6px;min-height:24px}
.scout .n{font:400 15px/1 var(--font-display);width:14px}
.ico{display:inline-flex}

.editor{grid-area:editor;min-width:0;min-height:0;overflow-y:auto;border-left:1px solid var(--line);padding:16px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-strong)}
.tab{background:none;border:0;border-left:1px solid var(--line);border-radius:0;padding:8px 8px 9px;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;align-items:center}
.tab:first-child{border-left:0}
.tab b{font:400 30px/1 var(--font-display);grid-row:span 2}
.tab .when{font-size:12px;color:var(--ink-dim)}
.tab .chip{font-size:11px}
.chip.ok{color:var(--ok)}
.chip.no{color:var(--amber)}
.chip.idle{color:var(--ink-dim)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper-deep)}
.tab[aria-pressed="true"] .when,.tab[aria-pressed="true"] .chip{color:inherit;opacity:.78}
.slots{display:grid;gap:10px;margin-top:12px}
.slot{border:1px solid var(--line-strong);padding:10px 12px;background:rgba(10,30,80,.25)}
.slot header{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center}
.slot h3{font-size:16px;font-weight:600}
.slot .nm p{font-size:12px;color:var(--ink-dim)}
.cost{text-align:right;font-size:10px;color:var(--ink-dim);line-height:1.1}
.cost b{display:block;font:400 26px/1 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.slot .x{background:none;border:1px solid var(--line);font-size:12px;padding:4px 8px;min-height:32px}
.spec{font-size:12px;color:var(--ink-dim);margin:8px 0 2px;font-variant-numeric:tabular-nums}
.knob{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:8px;margin-top:6px;font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
.seg button{background:none;border:0;border-left:1px solid var(--line);border-radius:0;padding:6px 4px;font-size:13px;min-height:36px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper-deep);font-weight:600}
.slot.add{display:flex;justify-content:space-between;align-items:center;border-style:dashed;background:none;width:100%;min-height:48px;text-align:left}
.slot.add span{font-size:12px;color:var(--ink-dim)}
.palette{margin-top:10px;border:1px solid var(--line-strong);padding:10px}
.palette .head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-dim);margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;background:none;border:1px solid var(--line);padding:8px}
.pick b{display:block;font-size:14px;font-weight:600}
.pick span.r{display:block;font-size:11.5px;color:var(--ink-dim);line-height:1.3}
.pick .c{font:400 18px/1 var(--font-display);font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.note{font-size:12.5px;color:var(--ink-dim);margin-top:10px;max-width:62ch}
.sec{font:400 18px/1.2 var(--font-display);margin-bottom:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec small{font:400 12px var(--font-body);color:var(--ink-dim)}
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.skillpick{display:grid;gap:2px;align-content:start;text-align:left;background:none;border:1px solid var(--line);padding:8px 10px}
.skillpick b{font-size:15px;font-weight:600}
.skillpick span{font-size:12px;color:var(--ink-dim);line-height:1.35}
.skillpick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper-deep)}
.skillpick[aria-pressed="true"] span{color:inherit;opacity:.78}
.big{width:100%;margin:12px 0 22px;min-height:52px;font-size:17px}
.targets{display:grid;gap:8px}
.target{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;background:none;border:1px solid var(--line);padding:10px 12px}
.target b{font:400 18px/1.25 var(--font-display)}
.target .rec{grid-column:1/-1;font-size:12px;color:var(--ink-dim)}
.target[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
.import{margin-top:16px}
.import label{font-size:12px;color:var(--ink-dim);display:block;margin-bottom:4px}
.import .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.err{color:var(--amber);font-size:12.5px;min-height:1.3em;margin-top:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper-deep);padding:8px 14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}

@media (max-width:860px){
  main{grid-template-columns:176px minmax(0,1fr);grid-template-rows:264px minmax(0,1fr);grid-template-areas:"stage sheet" "editor editor"}
  .stage{padding:12px 0 12px 16px}
  .sheetwrap{border-left:0;padding:12px 16px 12px 12px;overflow-y:auto;min-height:0}
  .editor{border-left:0;border-top:1px solid var(--line)}
  .cell{padding:5px 8px 6px}
  .lab{margin-bottom:2px}
  #bossName{font-size:18px}
}
@media (max-width:480px){
  .proto{display:none}
  .skills{grid-template-columns:1fr}
  .skillpick{grid-template-columns:64px minmax(0,1fr);align-items:baseline}
}

body.playing .bar,body.playing .sheetwrap,body.playing .editor{display:none}
body.playing main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"stage"}
body.playing .stage{padding:8px 8px 0;touch-action:none;user-select:none;-webkit-user-select:none}
body.playing canvas{cursor:none}
body.playing .pv{display:none}
body.playing .playbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 8px 12px;min-height:84px;width:100%;max-width:560px;margin:0 auto}
#playHint{font-size:12px;color:var(--ink-dim);text-align:center}
.skill{min-width:112px;min-height:60px;background:var(--amber);color:#1a2a55;border:0;font-weight:600;line-height:1.25;padding:6px 12px}
.skill small{display:block;font-weight:400;font-size:11px}
@media (prefers-reduced-motion:no-preference){
  .overlay .go{animation:nudge 1.4s ease-in-out infinite}
  @keyframes nudge{50%{border-color:var(--amber);color:var(--amber)}}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><h1>탄막 보스 메이커</h1><span class="proto">프로토타입</span></div>
    <nav class="views" aria-label="화면 전환">
      <button type="button" id="tabWorkshop" aria-pressed="true">작업실</button>
      <button type="button" id="tabChallenge" aria-pressed="false">도전</button>
    </nav>
  </header>
  <main>
    <section class="stage" id="stage">
      <div class="fit" id="fit">
        <div class="stagebox" id="stagebox">
          <canvas id="arena" role="img" aria-label="보스 아레나"></canvas>
          <div class="pv" id="pv"><span id="pvLabel">미리보기</span><button type="button" id="pvToggle">멈춤</button></div>
          <div class="overlay" id="overlay" hidden></div>
        </div>
      </div>
      <div class="playbar">
        <button type="button" class="b" id="btnExit">나가기</button>
        <p id="playHint"></p>
        <button type="button" class="skill" id="skillBtn"></button>
      </div>
    </section>
    <section class="sheetwrap" id="sheetWorkshop" aria-label="내 보스 요약">
      <div class="sheet">
        <div class="cell"><label class="lab" for="bossName">보스 이름</label><input id="bossName" type="text" maxlength="12" autocomplete="off" spellcheck="false"></div>
        <div class="cell"><span class="lab">코스트 예산</span><div class="budget"><div class="meter"><i id="budgetBar"></i></div><b id="budgetNum">0</b><span class="of">/ 100</span></div></div>
        <div class="cell"><span class="lab">페이즈 검증</span><div class="lamps" id="lamps"></div></div>
        <div class="cell"><span class="lab">공유 코드</span><div id="shareBox"></div></div>
      </div>
    </section>
    <section class="sheetwrap" id="sheetChallenge" aria-label="상대 정보" hidden></section>
    <section class="editor" id="editor"></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- 규칙 ---------- */
const W = 360, H = 540, TPS = 60, DT = 1 / TPS, TAU = Math.PI * 2;
const PHASE_TICKS = 600, EMIT_FROM = 0.7, EMIT_TO = 9.0;
const BOSS = { x: 180, y: 78 }, ZONE_Y = 150;
const PR = 3, PLAYER_SPEED = 520, MAX_BULLETS = 260, BUDGET = 100;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lv = (arr, n) => arr[n - 1];

const CARD = {
  r: { name: '원형 확산', role: '공간을 채워요', base: 8, sc: 3, dc: 4, css: 'var(--amber)' },
  s: { name: '나선', role: '돌면서 쓸어내요', base: 10, sc: 3, dc: 4, css: 'var(--hot)' },
  a: { name: '조준탄', role: '멈춘 사람을 잡아요', base: 10, sc: 4, dc: 3, css: 'var(--ink)' },
  h: { name: '유도탄', role: '계속 움직이게 해요', base: 14, sc: 4, dc: 5, css: 'var(--pink)' },
  w: { name: '벽', role: '틈으로만 지나가요', base: 14, sc: 4, dc: 5, css: 'var(--ink)' },
  l: { name: '레이저', role: '길을 잘라요', base: 18, sc: 5, dc: 6, css: 'var(--pink)' },
};
const ORDER = ['r', 's', 'a', 'h', 'w', 'l'];
const P = {
  r: { int: [1.5, 1.1, 0.8], n: [14, 20, 26], v: [70, 100, 135] },
  s: { int: 0.11, arms: [2, 3, 4], v: [75, 105, 140] },
  a: { int: 1.05, fan: [1, 3, 5], v: [160, 220, 290] },
  h: { int: [2.6, 1.8, 1.25], v: [62, 86, 112], life: 4.6 },
  w: { int: [3.4, 2.6, 1.9], gap: [92, 78, 66], v: [70, 100, 135] },
  l: { int: [2.8, 2.1, 1.6], tele: [0.9, 0.7, 0.5], act: 0.5, w: 40 },
};
const SKILL = {
  bomb: { name: '폭탄', desc: '화면의 탄을 모두 지워요' },
  slow: { name: '슬로우', desc: '3초간 보스의 시간이 느려져요' },
  dash: { name: '대시', desc: '1초간 무적이 돼요' },
};

const cardCost = c => CARD[c.t].base + (c.s - 1) * CARD[c.t].sc + (c.d - 1) * CARD[c.t].dc;
const bossCost = b => b.phases.reduce((n, ph) => n + ph.reduce((m, c) => m + cardCost(c), 0), 0);
function specLine(c) {
  const p = P[c.t];
  switch (c.t) {
    case 'r': return `${lv(p.n, c.d)}발씩 ${lv(p.int, c.d)}초마다 · 탄속 ${lv(p.v, c.s)}`;
    case 's': return `${lv(p.arms, c.d)}줄기 회전 · 탄속 ${lv(p.v, c.s)}`;
    case 'a': return `${lv(p.fan, c.d)}갈래 조준 · 탄속 ${lv(p.v, c.s)}`;
    case 'h': return `${lv(p.int, c.d)}초마다 1발 · 탄속 ${lv(p.v, c.s)} · ${p.life}초 추적`;
    case 'w': return `틈 ${lv(p.gap, c.d)} · ${lv(p.int, c.d)}초마다 · 낙하 ${lv(p.v, c.s)}`;
    default: return `${c.d}줄 · 예고 ${lv(p.tele, c.s)}초 · ${lv(p.int, c.s)}초마다`;
  }
}

/* ---------- 시뮬레이션 (고정 틱, 난수 없음) ---------- */
function makeSim(boss, o = {}) {
  const hearts = o.hearts ?? 3;
  const sim = {
    boss, phases: o.phases || [0, 1, 2], pi: 0, tick: 0, ptick: 0, pt: 0,
    bullets: [], lasers: [], em: [],
    p: { x: W / 2, y: 462, inv: 0 },
    hearts, skill: o.skill || null, skillUsed: false, slow: 0, dash: 0,
    dummy: !!o.dummy, over: null, hits: 0, failAt: null, ev: [],
  };
  resetPhase(sim);
  return sim;
}
function cloneSim(s) {
  return { ...s, bullets: s.bullets.map(b => ({ ...b })), lasers: s.lasers.map(l => ({ ...l })), em: s.em.map(e => ({ ...e })), p: { ...s.p }, ev: null };
}
function resetPhase(sim) {
  const cards = sim.boss.phases[sim.phases[sim.pi]];
  sim.em = cards.map((c, i) => ({ next: EMIT_FROM + i * 0.27, k: 0 }));
  sim.pt = 0; sim.ptick = 0;
}
function emit(sim, e) { if (sim.ev) sim.ev.push(e); }
function intervalOf(c) {
  const p = P[c.t];
  if (c.t === 's' || c.t === 'a') return p.int;
  return lv(p.int, c.t === 'l' ? c.s : c.d);
}
function add(sim, k, x, y, vx, vy, r, extra) {
  if (sim.bullets.length >= MAX_BULLETS) return;
  const b = { k, x, y, vx, vy, r };
  if (extra) Object.assign(b, extra);
  sim.bullets.push(b);
}
function fire(sim, c, i, k, t) {
  const p = P[c.t], pl = sim.p;
  emit(sim, { k: 'fire' });
  if (c.t === 'r') {
    const n = lv(p.n, c.d), v = lv(p.v, c.s), off = (k * 0.5 + i * 0.31) * (TAU / n);
    for (let j = 0; j < n; j++) { const a = off + j * TAU / n; add(sim, 'r', BOSS.x, BOSS.y, Math.cos(a) * v, Math.sin(a) * v, 6); }
  } else if (c.t === 's') {
    const arms = lv(p.arms, c.d), v = lv(p.v, c.s), base = i * 0.9 + (i % 2 ? -1 : 1) * 1.25 * t;
    for (let j = 0; j < arms; j++) { const a = base + j * TAU / arms; add(sim, 's', BOSS.x, BOSS.y, Math.cos(a) * v, Math.sin(a) * v, 5); }
  } else if (c.t === 'a') {
    const fan = lv(p.fan, c.d), v = lv(p.v, c.s), a0 = Math.atan2(pl.y - BOSS.y, pl.x - BOSS.x);
    for (let f = 0; f < fan; f++) {

const phaseKey = cards => cards.length ? cards.map(c => c.t + c.s + c.d).join('') : 'x';
const cleanName = s => [...String(s || '').replace(/\s+/g, ' ').trim()].slice(0, 12).join('');
const hex = str => Array.from(new TextEncoder().encode(str), b => b.toString(16).padStart(2, '0')).join('');
function unhex(h) {
  const a = new Uint8Array(h.length / 2);
  for (let i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16);
  return new TextDecoder().decode(a);
}
function checksum(s) {
  let n = 0;
  for (let i = 0; i < s.length; i++) n = (n + s.charCodeAt(i) * (i + 1)) % 1296;
  return n.toString(36).padStart(2, '0');
}
function encode(b) {
  const body = ['bm1', ...b.phases.map(phaseKey), hex(cleanName(b.name)) || '0'].join('-');
  return body + '-' + checksum(body);
}
function decode(str) {
  const bad = { error: '코드 형식이 맞지 않아요. bm1-로 시작하는 코드를 통째로 붙여 넣어 주세요.' };
  const parts = String(str).trim().toLowerCase().replace(/^#/, '').split('-');
  if (parts.length !== 6 || parts[0] !== 'bm1') return bad;
  if (checksum(parts.slice(0, 5).join('-')) !== parts[5]) return { error: '코드가 중간에 잘렸거나 바뀐 것 같아요. 다시 복사해 주세요.' };
  const phases = [];
  for (let i = 1; i <= 3; i++) {
    const k = parts[i];
    if (k === 'x') { phases.push([]); continue; }
    if (!/^([rsahwl][1-3][1-3]){1,3}$/.test(k)) return bad;
    const cards = [];
    for (let j = 0; j < k.length; j += 3) cards.push({ t: k[j], s: +k[j + 1], d: +k[j + 2] });
    phases.push(cards);
  }
  let name = '';
  if (parts[4] !== '0') {
    if (!/^([0-9a-f]{2})+$/.test(parts[4])) return bad;
    try { name = unhex(parts[4]); } catch (e) { return bad; }
  }
  const boss = { name: cleanName(name) || '이름 없는 보스', phases };
  if (bossCost(boss) > BUDGET) return { error: '예산 100을 넘는 보스라서 불러올 수 없어요.' };
  return { boss };
}

  else for (let i = 0; i < 3; i++) {
    heart(g, 17 + i * 18, 10, 14);
    if (i < sim.hearts) { g.fillStyle = C.hot; g.fill(); } else { g.strokeStyle = 'rgba(243,239,226,.5)'; g.lineWidth = 1.2; g.stroke(); }
  }
  const segs = sim.phases.length, x0 = 92, x1 = 302, gap = 4, sw = (x1 - x0 - gap * (segs - 1)) / segs;
  for (let s = 0; s < segs; s++) {
    const x = x0 + s * (sw + gap), f = s < sim.pi ? 1 : s === sim.pi ? sim.ptick / PHASE_TICKS : 0;
    g.fillStyle = 'rgba(243,239,226,.22)'; g.fillRect(x, 14, sw, 6);
    g.fillStyle = C.ink; g.fillRect(x, 14, sw * f, 6);
  }
  const remain = Math.max(0, ((segs - sim.pi) * PHASE_TICKS - sim.ptick) / TPS);
  g.font = '400 16px ' + FD; g.fillStyle = C.ink; g.textAlign = 'right'; g.fillText(remain.toFixed(1), 352, 18);
  if (sim.slow > 0) { g.font = '600 11px ' + FB; g.fillStyle = C.amber; g.textAlign = 'center'; g.fillText('슬로우', W / 2, 34); }
}
function render(now) {
  const g = ctx, sim = scene.sim;
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (bgCache) g.drawImage(bgCache, 0, 0);
  let ox = 0, oy = 0;
  if (shake > 0) { ox = Math.sin(shake * 2.7) * shake * 0.5; oy = Math.cos(shake * 3.1) * shake * 0.4; shake--; }
  g.setTransform(view.scale, 0, 0, view.scale, ox * view.scale, oy * view.scale);
  if (sim) drawLasers(g, sim);
  drawBoss(g, now);
  if (sim) { drawBullets(g, sim); drawPlayer(g, sim); }
  drawFx(g, now);
  if (scene.kind === 'play') drawHud(g, sim);
  if (scene.kind === 'idle') {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '400 30px ' + FD; g.fillStyle = C.ink; g.fillText(scene.boss.name, W / 2, 190);
    g.font = '400 12px ' + FB; g.fillStyle = 'rgba(183,199,234,.95)'; g.fillText('탄막은 들어가 봐야 알 수 있어요', W / 2, 218);
  }
  if (banner) {
    const a = now - banner.t;
    if (a < 0.9) { g.globalAlpha = 1 - a / 0.9; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '400 46px ' + FD; g.fillStyle = C.ink; g.fillText(banner.text, W / 2, 300); g.globalAlpha = 1; }
    else banner = null;
  }
}
let last = 0;
function frame(ms) {
  const now = ms / 1000, dtm = Math.min(0.1, now - last); last = now;
  pulse = Math.max(0, pulse - dtm * 6);
  const sc = scene;
  if (sc.sim && sc.running) {
    acc += dtm; let n = 0;
    while (acc >= DT && n < 6) {
      if (sc.kind === 'play') applyKeys(sc.sim);
      stepSim(sc.sim, input); input.skill = false;
      drain(sc.sim, now);
      acc -= DT; n++;
      if (sc.sim.over) { finish(); break; }
    }
    if (n === 6) acc = 0;
  }
  render(now);
  requestAnimationFrame(frame);
}

/* ---------- 시작 ---------- */
function readHash() {
  const h = location.hash.replace(/^#/, '');
  if (!/^bm1-/i.test(h)) return false;
  const r = addImported(h);
  if (r.error) return false;
  state.view = 'challenge';
  return true;
}
function start(data) {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { /* 저장소 없이 시작 */ }
  applySaved(data && data.boss ? data : saved);
  if (RM) state.previewOn = false;
  readHash();
  $('#bossName').value = state.boss.name;
  renderAll();
  new ResizeObserver(fit).observe(fitEl);
  fit(); rebuildScene();
  requestAnimationFrame(ms => { last = ms / 1000; requestAnimationFrame(frame); });
}
window.addEventListener('hashchange', () => { if (!play && readHash()) { save(); renderAll(); rebuildScene(); } });
window.__bm = { makeSim, stepSim, cloneSim, encode, decode, bossCost, SAMPLES, W, H, ZONE_Y };
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(snap);
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
