<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="theme-color" content="#3d6fd8">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./assets/icons/favicon-64.png">

<link rel="preload" href="./assets/fonts/BagelFatOne.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./assets/fonts/GowunDodum.woff2" as="font" type="font/woff2" crossorigin>
