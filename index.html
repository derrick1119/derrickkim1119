<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<meta name="description" content="THE LAMP: 마지막 불씨 — 빛은 무기이고 어둠은 숨을 곳이다. 램프를 켜고 끄며 새벽까지 살아남는 로그라이트 생존 액션.">
<title>THE LAMP: 마지막 불씨</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307080f'/%3E%3Ccircle cx='32' cy='36' r='22' fill='%23ffb45a' opacity='.25'/%3E%3Cpath d='M21 22 32 12l11 10z' fill='%232a3342'/%3E%3Crect x='23' y='22' width='18' height='26' rx='2' fill='%23ffe7a8'/%3E%3Crect x='21' y='48' width='22' height='5' fill='%232a3342'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="게임 화면"></canvas>

  <!-- 게임 중 HUD -->
  <div id="hud" class="hidden">
    <div class="xp"><div id="xpFill"></div></div>
    <div class="hud-top">
      <div class="hud-left">
        <div class="lvl" id="lvl">Lv 1</div>
        <div class="oil" id="oil">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c4 5 6 8 6 12a6 6 0 0 1-12 0c0-4 2-7 6-12z"/></svg>
          <div class="oil-bar"><div id="oilFill"></div></div>
          <span id="oilTxt">100</span>
        </div>
      </div>
      <div class="clock">
        <div class="clock-row"><span id="clockLabel">새벽까지</span> <b id="clock">7:00</b></div>
        <div class="nightbar"><div id="nightFill"></div></div>
      </div>
      <div class="hud-right">
        <div class="stat" title="lamps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8 12 3l5 5zM8 9h8l-1 9H9zM7 19h10v2H7z"/></svg><span id="lamps">0/8</span></div>
        <div class="stat" title="kills"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a8 8 0 0 0-8 8c0 3 1.6 5 3 6v4l2.5-2L12 21l2.5-2 2.5 2v-4c1.4-1 3-3 3-6a8 8 0 0 0-8-8zM9 10a1.6 1.6 0 1 1 0 3.2A1.6 1.6 0 0 1 9 10zm6 0a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2z"/></svg><span id="kills">0</span></div>
        <button id="btnPause" class="icon-btn" aria-label="pause"><svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
      </div>
    </div>
    <div id="bossbar" class="hidden"><span id="bossName">월식</span><div class="bossbar-track"><div id="bossFill"></div></div></div>
    <div id="toasts"></div>
    <div id="tip" class="hidden"></div>
    <button id="btnLamp" class="lamp-btn lit" aria-label="lamp">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8 12 3l5 5zM8 9h8l-1 9H9zM7 19h10v2H7z"/></svg>
      <span id="lampLabel">빛</span>
      <kbd>Space</kbd>
    </button>
  </div>
  <div id="stick" class="hidden"><i></i></div>

  <!-- 타이틀 -->
  <section id="screen-title" class="screen">
    <div class="title-wrap">
      <div class="logo">
        <div class="logo-lamp" aria-hidden="true"></div>
        <h1>THE LAMP</h1>
        <p class="logo-sub" data-t="sub">마지막 불씨</p>
      </div>
      <p class="tagline" data-t="tagline"></p>
      <p class="story" data-t="story"></p>
      <div id="nights" class="nights"></div>
      <p id="nightInfo" class="night-info"></p>
      <div class="menu">
        <button id="btnStart" class="btn primary" data-t="btn.start"></button>
        <div class="menu-row">
          <button id="btnWorkshop" class="btn" data-t="btn.workshop"></button>
          <button id="btnHow" class="btn" data-t="btn.how"></button>
        </div>
      </div>
    </div>
    <div class="corner">
      <span class="lumen-chip"><i class="gem"></i><b id="titleLumen">0</b></span>
      <button id="btnSound" class="chip"></button>
      <button id="btnLang" class="chip" data-t="btn.lang"></button>
      <button id="btnFull" class="chip" data-t="btn.full"></button>
    </div>
  </section>

  <!-- 플레이 방법 -->
  <section id="screen-how" class="screen panel-screen hidden">
    <div class="panel">
      <h2 data-t="how.title"></h2>
      <div class="how-grid">
        <div class="how-item light"><h3 data-t="how.1.t"></h3><p data-t="how.1.d"></p></div>
        <div class="how-item dark"><h3 data-t="how.2.t"></h3><p data-t="how.2.d"></p></div>
        <div class="how-item light"><h3 data-t="how.3.t"></h3><p data-t="how.3.d"></p></div>
        <div class="how-item dawn"><h3 data-t="how.4.t"></h3><p data-t="how.4.d"></p></div>
      </div>
      <p class="keys" id="howKeys"></p>
      <button class="btn" data-back data-t="btn.back"></button>
    </div>
  </section>

  <!-- 등불 공방 -->
  <section id="screen-workshop" class="screen panel-screen hidden">
    <div class="panel wide">
      <div class="panel-head">
        <div><h2 data-t="ws.title"></h2><p class="muted" data-t="ws.sub"></p></div>
        <span class="lumen-chip big"><i class="gem"></i><b id="wsLumen">0</b></span>
      </div>
      <div id="metaGrid" class="meta-grid"></div>
      <button class="btn" data-back data-t="btn.back"></button>
    </div>
  </section>

  <!-- 레벨업 -->
  <div id="overlay-level" class="overlay hidden">
    <div class="level-box">
      <h2 id="lvTitle"></h2>
      <p class="muted" id="lvSub"></p>
      <div id="cards" class="cards"></div>
      <button id="btnReroll" class="btn small"></button>
    </div>
  </div>

  <!-- 일시정지 -->
  <div id="overlay-pause" class="overlay hidden">
    <div class="panel narrow">
      <h2 data-t="pause.title"></h2>
      <div id="pauseBuild" class="build"></div>
      <button id="btnResume" class="btn primary" data-t="btn.resume"></button>
      <button id="btnSound2" class="btn"></button>
      <button id="btnQuit" class="btn danger" data-t="btn.quit"></button>
    </div>
  </div>

  <!-- 결과 -->
  <div id="overlay-result" class="overlay hidden">
    <div class="panel narrow result">
      <h2 id="resTitle"></h2>
      <p class="muted" id="resSub"></p>
      <div class="res-grid" id="resGrid"></div>
      <div class="res-lumen"><i class="gem"></i><span data-t="res.lumen"></span><b id="resLumen">0</b></div>
      <p id="resUnlock" class="unlock hidden"></p>
      <button id="btnNext" class="btn primary hidden" data-t="btn.next"></button>
      <button id="btnRetry" class="btn primary" data-t="btn.retry"></button>
      <div class="menu-row">
        <button id="btnResWorkshop" class="btn" data-t="btn.workshop"></button>
        <button id="btnMenu" class="btn" data-t="btn.menu"></button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
