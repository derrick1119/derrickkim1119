<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a2340">
<meta name="description" content="블록을 꾹 누르면 무너질 모양이 보여요. 떼면 폭약 착! 3·2·1 쾅 — 헬멧 쓴 비버 철거반의 장난감 마을 철거.">
<title>비버 철거반</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#2a2340;color:#fff8ec;font:16px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none}
main{max-width:460px;margin:0 auto;padding:0 0 24px}
@media (min-width:461px){main{padding:0 10px 24px}}
header{height:44px;display:flex;align-items:center;padding:0 12px}
h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.01em}
h1 span{color:#ffc845}
#game{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.g-canvas{display:block;margin:0 auto;touch-action:none;outline:none}
.g-canvas:focus-visible{box-shadow:0 0 0 3px #ffc845}
.g-overlay{position:absolute;inset:0;margin:auto;width:min(100%,440px);border:0;border-radius:14px;background:#2a2340c4;color:#fff8ec;font:inherit;cursor:pointer;display:grid;place-content:center;gap:8px;text-align:center;padding:16px}
.g-overlay b{font-size:34px}
.g-overlay span{font-size:15px;color:#c9b9d9;word-break:keep-all}
.g-overlay:focus-visible{outline:3px solid #ffc845}
.rules{margin:10px 14px 0;padding:0;list-style:none;color:#c9b9d9;font-size:14px;word-break:keep-all}
.ver{color:#8f80a6;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<main>
<header><h1>💥 비버 <span>철거반</span></h1></header>
<div id="game"></div>
<ul class="rules">
<li>🧨 블록을 꾹 누르면 무너질 모양이 보이고, 떼면 폭약이 붙어요. 다 붙이면 3·2·1 쾅!</li>
<li>🚧 빨간 선 밖 이웃집은 건드리지 말고, 목표 높이 아래로 무너뜨려요.</li>
</ul>
<p class="ver">스튜디오 빌드 M0 · 프로토타입 이전</p>
</main>
<script>/*BUNDLE*/</script>
</body>
</html>
