<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1f">
<meta name="description" content="작은 행성을 운석에서 지키고, 지키는 동안 기지를 키우세요.">
<title>행성 수호대</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0a0e1f;color:#e8f7ff;font:16px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;overscroll-behavior:none}
#wrap{position:relative;height:100dvh;max-width:560px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;outline:none}
#hud{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid #2b3566;background:#141b38cc;color:#e8f7ff;font-size:20px;cursor:pointer}
.icon:focus-visible,.btn:focus-visible{outline:3px solid #ffe14d;outline-offset:2px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:linear-gradient(#0a0e1fcc 0%,#0a0e1f99 45%,#0a0e1fee 100%)}
.screen[hidden]{display:none}
h1{font-size:clamp(34px,10vw,52px);line-height:1.05;margin:0 0 4px;letter-spacing:-.02em}
h1 span{color:#7cf2c4}
.tag{color:#8f9bd6;margin:0 0 22px}
ol.rules{list-style:none;padding:0;margin:0 0 24px;max-width:340px;text-align:left}
ol.rules li{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;background:#141b38d9;border:1px solid #232c57;border-radius:12px;padding:10px 12px}
ol.rules b{flex:none;width:24px;height:24px;border-radius:50%;background:#7cf2c4;color:#0a0e1f;display:grid;place-items:center;font-size:14px}
.btn{min-width:200px;min-height:52px;border:0;border-radius:14px;background:#ffe14d;color:#1b1b2f;font:800 19px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 0 #b39a1f;margin:6px}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b39a1f}
.btn.ghost{background:#1c2547;color:#e8f7ff;box-shadow:0 6px 0 #0d1230}
.keys{color:#8f9bd6;font-size:13px;margin-top:14px}
kbd{background:#1c2547;border-radius:4px;padding:1px 5px;font:inherit}
#result{justify-content:flex-end;padding-bottom:32px;background:linear-gradient(#0a0e1f00 0%,#0a0e1f00 30%,#0a0e1fee 62%)}
.big{font-size:56px;font-weight:900;margin:0;color:#ffe14d;line-height:1}
#r-best{color:#7cf2c4;margin:2px 0 12px;font-weight:700}
dl{display:grid;grid-template-columns:auto auto;gap:4px 16px;margin:0 0 16px;text-align:left}
dt{color:#8f9bd6}dd{margin:0;font-weight:700}
.cause{color:#ff8a8a;margin:0 0 10px;font-size:14px}
.next{color:#ffe14d;margin:0 0 14px;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" tabindex="0" aria-label="행성 수호대 게임 화면"></canvas>
  <div id="hud" hidden>
    <button class="icon" id="mute" aria-label="소리 끄기">🔊</button>
    <button class="icon" id="pausebtn" aria-label="일시정지">⏸</button>
  </div>
  <section class="screen" id="title" aria-labelledby="t-h">
    <h1 id="t-h">행성 <span>수호대</span></h1>
    <p class="tag">작은 행성을 지키고, 기지를 키워요</p>
    <ol class="rules">
      <li><b>1</b><span>위성이 행성 둘레를 저절로 돌며 운석을 쏘고 막아요.</span></li>
      <li><b>2</b><span>웨이브를 막을 때마다 게임이 멈추고 카드가 나와요. 다음 웨이브를 보고 하나를 골라 기지를 지어요.</span></li>
      <li><b>3</b><span>운석을 부수면 광석이 쌓여요. 마음에 드는 카드가 없으면 광석으로 다시 뽑아요. 방어막이 다 깨지면 끝.</span></li>
    </ol>
    <button class="btn" id="start">지키러 가기</button>
    <p class="keys">키보드: <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 또는 <kbd>←</kbd><kbd>→</kbd><kbd>Enter</kbd> 건설 · <kbd>R</kbd> 다시 뽑기 · <kbd>P</kbd> 일시정지 · <kbd>M</kbd> 소리</p>
    <p class="keys" id="best"></p>
  </section>
  <section class="screen" id="pause" hidden aria-labelledby="p-h">
    <h1 id="p-h">일시정지</h1>
    <p class="tag">운석도 기다려 줄게요</p>
    <button class="btn" id="resume">계속하기</button>
    <button class="btn ghost" id="quit">처음으로</button>
  </section>
  <section class="screen" id="result" hidden aria-labelledby="r-h" aria-live="polite">
    <h2 id="r-h" class="sr">결과</h2>
    <p>기지 전경</p>
    <p class="big" id="r-score">0</p>
    <p id="r-best"></p>
    <p id="r-cause" class="cause"></p>
    <dl id="r-stats"></dl>
    <p id="r-next" class="next"></p>
    <button class="btn" id="again">다시 지키기</button>
  </section>
</div>
<script>/*BUNDLE*/</script>
</body>
</html>
