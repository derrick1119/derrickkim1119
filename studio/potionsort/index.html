<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1530">
<meta name="description" content="병을 톡, 다른 병을 톡 — 콸콸! 같은 색을 한 병에 모으면 펑. 💥 부글 물약은 아무 병에나 퐁! 고양이 마녀의 물약 공방 퍼즐.">
<title>마녀 고양이 물약 정렬</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#1e1530;color:#fff6ec;font:16px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none}
main{max-width:460px;margin:0 auto;padding:0 0 24px}
@media (min-width:461px){main{padding:0 10px 24px}}
header{height:44px;display:flex;align-items:center;padding:0 8px 0 12px}
h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.01em}
h1 span{color:#ffc65c}
#game{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.g-canvas{display:block;margin:0 auto;touch-action:none;outline:none}
.g-canvas:focus-visible{box-shadow:0 0 0 3px #ffc65c}
.g-overlay{position:absolute;inset:0;margin:auto;width:min(100%,440px);border:0;border-radius:14px;background:#1e1530d0;color:#fff6ec;font:inherit;cursor:pointer;display:grid;place-content:center;gap:8px;text-align:center;padding:16px}
.g-overlay b{font-size:28px;word-break:keep-all}
.g-overlay span{font-size:16px;color:#c9b8de}
.g-overlay:focus-visible{outline:3px solid #ffc65c}
.ver{color:#8f80a6;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<main>
  <header><h1>🧪 마녀 고양이 <span>물약 정렬</span></h1></header>
  <div id="game"></div>
  <p class="ver">스튜디오 빌드 M0 · 프로토타입 이전</p>
</main>
<script>/*BUNDLE*/</script>
</body>
</html>
