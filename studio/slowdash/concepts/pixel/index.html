<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>A · 도트 시안</title>
<style>
  html,body{margin:0;background:#0f1120;}
  #board{width:390px;height:844px;position:relative;overflow:hidden;background:#13162a;
    font-family:'WenQuanYi Zen Hei',sans-serif;color:#e9eef4;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  header{height:60px;box-sizing:border-box;padding:9px 14px 0 14px;background:#0f1120;border-bottom:1px solid #2a3150;}
  .t1{display:flex;align-items:baseline;gap:8px;line-height:1}
  .t1 b{font-size:22px;letter-spacing:-0.5px;color:#fff}
  .t1 b em{font-style:normal;color:#7cf8dd}
  .t1 span{font-size:14px;color:#9fb4c6}
  .t2{margin-top:7px;font-size:12.5px;color:#c8d7e0;letter-spacing:-0.2px}
  .t2 i{font-style:normal;color:#ffd340}
  #scene{width:390px;height:594px}
  .bottom{height:190px;box-sizing:border-box;padding:7px 8px 0 8px;background:#0f1120;border-top:1px solid #2a3150}
  .panels{display:flex;gap:6px}
  .panel{position:relative;width:184px;height:120px;border-radius:3px;overflow:hidden;background:#242c4a;box-shadow:inset 0 0 0 1px #3a4668}
  .cap{position:absolute;left:5px;bottom:5px;font-size:12px;line-height:1;padding:3px 5px 3px;background:rgba(15,17,32,.82);border-radius:2px;color:#e9eef4}
  .cap.tl{top:5px;bottom:auto}
  #cut{width:186px;height:120px;margin-left:-1px}
  #face{position:absolute;left:0;top:0;width:186px;height:120px}
  .pc{margin-top:8px;font-size:12.5px;line-height:19px;letter-spacing:-0.3px}
  .pc p{margin:0;white-space:nowrap}
  .pc i{font-style:normal;display:inline-block;width:30px;font-weight:bold}
  .pc .g i{color:#7cf8dd} .pc .b i{color:#9fb4c6}
</style></head>
<body>
<div id="board">
  <header>
    <div class="t1"><b><em>A</em> · 도트</b><span>픽셀 아트 · 16비트 감성</span></div>
    <div class="t2">가볍고 선명하다 — 잿빛으로 멈춘 마을 위, <i>칼빛 한 줄</i>이 주인공</div>
  </header>
  <canvas id="scene"></canvas>
  <div class="bottom">
    <div class="panels">
      <div class="panel"><canvas id="cut"></canvas><span class="cap tl">벤 직후</span></div>
      <div class="panel"><canvas id="face"></canvas><span class="cap">얼굴 ×6 · 표정 3종</span></div>
    </div>
    <div class="pc">
      <p class="g"><i>장점</i>스프라이트가 글자 몇 KB · 저사양 폰도 가볍고 또렷</p>
      <p class="b"><i>단점</i>표정·모션 프레임을 손으로 찍어야 해 동작 추가가 느림</p>
    </div>
  </div>
</div>
<script src="sprites.js"></script>
<script src="engine.js"></script>
<script src="scene.js"></script>
<script src="panels.js"></script>
<script>
  drawScene(document.getElementById('scene'));
  if (typeof drawCut==='function') drawCut(document.getElementById('cut'));
  if (typeof drawFace==='function') drawFace(document.getElementById('face'));
</script>
</body></html>
