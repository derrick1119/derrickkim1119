<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#101734}
body{width:390px;height:844px;overflow:hidden;font-family:'WenQuanYi Zen Hei',sans-serif;color:#eef2ff}
#top{height:60px;box-sizing:border-box;padding:9px 14px 0;background:linear-gradient(#1b2552,#131b3c);border-bottom:1px solid #2c3a72}
#top h1{margin:0;font-size:19px;font-weight:bold;letter-spacing:-.3px}
#top h1 b{color:#4fe6d8}
#top p{margin:5px 0 0;font-size:12px;color:#b2bde4;letter-spacing:-.2px}
canvas{display:block}
#bot{height:191px;box-sizing:border-box;padding:8px 10px 0;background:#131b3c;border-top:1px solid #2c3a72}
.row{display:flex;gap:8px}
.cell{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.cell span{position:absolute;left:7px;top:6px;font-size:12px;background:rgba(12,16,40,.62);padding:2px 8px;border-radius:9px;color:#fff}
.t{font-size:12.5px;line-height:19px;margin-top:7px;letter-spacing:-.3px}
.t div{white-space:nowrap}
.t em{font-style:normal;font-weight:bold;margin-right:4px}
.g{color:#4fe6d8}.b{color:#ff8f8f}
</style></head><body>
<div id="top"><h1>D · <b>2D 일러스트</b> (카툰 셀 셰이딩)</h1><p>둥근 곡선 캐릭터 · 굵기가 변하는 손그림 선 · 2단 명암과 림라이트</p></div>
<canvas id="scene"></canvas>
<div id="bot">
  <div class="row">
    <div class="cell"><canvas id="p1"></canvas><span>벤 직후</span></div>
    <div class="cell"><canvas id="p2"></canvas><span>초침 클로즈업</span></div>
  </div>
  <div class="t">
    <div><em class="g">장점</em>표정·실루엣이 커서 첫눈에 귀엽고, 작은 폰에서도 또렷하다</div>
    <div><em class="b">단점</em>캐릭터·적마다 손이 많이 간다 — 벡터 그대로 그리면 무겁다</div>
  </div>
</div>
<script src="lib.js"></script>
<script src="chars.js"></script>
<script src="world.js"></script>
<script src="scene.js"></script>
</body></html>
