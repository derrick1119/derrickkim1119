<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>B · 3D 토이</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; background: #141a33; font-family: 'WenQuanYi Zen Hei', sans-serif; color: #eef2ff; }
  .top { height: 60px; padding: 9px 14px 0; background: linear-gradient(180deg, #1d2550, #151b3b); border-bottom: 1px solid rgba(255,255,255,0.08); }
  .top h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.3px; line-height: 24px; }
  .top h1 b { color: #ffcf6a; margin-right: 6px; }
  .top p { font-size: 12.5px; color: #b8c2e6; margin-top: 3px; line-height: 16px; }
  .main { position: relative; width: 390px; height: 593px; overflow: hidden; background: #333; }
  .main img { display: block; width: 390px; height: 593px; }
  .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 85% at 50% 55%, rgba(0,0,0,0) 60%, rgba(10,16,40,0.38) 100%); }
  .hud { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; align-items: center; justify-content: space-between; }
  .gauge { display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 5px; border-radius: 16px; background: rgba(18, 26, 58, 0.55); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 2px 6px rgba(0,0,0,0.25); }
  .gauge svg { display: block; }
  .bar { width: 128px; height: 9px; border-radius: 6px; background: rgba(0,0,0,0.35); box-shadow: inset 0 1px 2px rgba(0,0,0,0.5); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 66%; border-radius: 6px; background: linear-gradient(180deg, #8ffff2 0%, #22d6c4 55%, #11a99c 100%); box-shadow: 0 0 8px rgba(40,240,220,0.7); }
  .stars { display: flex; gap: 4px; padding: 4px 7px; border-radius: 16px; background: rgba(18, 26, 58, 0.55); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 2px 6px rgba(0,0,0,0.25); }
  .bot { height: 191px; padding: 9px 10px 0; background: linear-gradient(180deg, #161c3d, #10142c); }
  .cards { display: flex; gap: 10px; }
  .card { position: relative; width: 180px; height: 118px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 4px 12px rgba(0,0,0,0.4); }
  .card img { display: block; width: 180px; height: 118px; }
  .card span { position: absolute; left: 6px; top: 6px; font-size: 12px; line-height: 12px; padding: 4px 7px 3px; border-radius: 9px; background: rgba(12,16,36,0.62); color: #f3f6ff; }
  .pc { margin-top: 9px; font-size: 12.5px; line-height: 17px; color: #d7def7; }
  .pc b { display: inline-block; width: 30px; font-weight: 700; }
  .pc .p b { color: #4fe6d6; } .pc .c b { color: #ffb36b; }
</style></head>
<body>
  <div class="top">
    <h1><b>B</b>3D · 말랑한 장난감 디오라마</h1>
    <p>반질반질 소프트 비닐·나무 장난감을 손에 쥔 듯한 입체감</p>
  </div>
  <div class="main">
    <img id="main" alt="">
    <div class="vig"></div>
    <div class="hud">
      <div class="gauge">
        <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7.4" fill="#0f1a3a" stroke="#3ff2df" stroke-width="1.8"/><path d="M9 4.6V9l3 1.8" stroke="#bffcf5" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        <div class="bar"><i></i></div>
      </div>
      <div class="stars">
        <svg width="54" height="17" viewBox="0 0 54 17">
          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#f2a93a"/></linearGradient></defs>
          <g transform="translate(1,0)"><path d="M8 1l2.1 4.6 5 .5-3.8 3.4 1.1 4.9L8 11.9 3.6 14.4l1.1-4.9L.9 6.1l5-.5z" fill="url(#g)" stroke="#a8641a" stroke-width=".8" stroke-linejoin="round"/></g>
          <g transform="translate(19,0)"><path d="M8 1l2.1 4.6 5 .5-3.8 3.4 1.1 4.9L8 11.9 3.6 14.4l1.1-4.9L.9 6.1l5-.5z" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.35)" stroke-width=".8" stroke-linejoin="round"/></g>
          <g transform="translate(37,0)"><path d="M8 1l2.1 4.6 5 .5-3.8 3.4 1.1 4.9L8 11.9 3.6 14.4l1.1-4.9L.9 6.1l5-.5z" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.35)" stroke-width=".8" stroke-linejoin="round"/></g>
        </svg>
      </div>
    </div>
  </div>
  <div class="bot">
    <div class="cards">
      <div class="card"><img id="cut" alt=""><span>벤 직후</span></div>
      <div class="card"><img id="close" alt=""><span>초침 클로즈업</span></div>
    </div>
    <div class="pc p"><b>장점</b>손에 잡힐 듯한 장난감 질감, 빛·그림자로 깊이가 산다</div>
    <div class="pc c"><b>단점</b>3D 엔진을 직접 짜야 하고 폰 발열·용량 부담이 가장 크다</div>
  </div>
  <script src="bundle.js"></script>
</body></html>
