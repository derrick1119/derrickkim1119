<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5a9a3a">
<meta name="description" content="꼬마 유령이 톡 한 적의 몸으로 옮겨 탄다 — 버린 몸은 펑!">
<title>몸 갈아타기</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#6aa84a;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:#fff}
#gl,#ov{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}
#ov{pointer-events:none}
.hud{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;align-items:center;gap:8px;pointer-events:none}
.pill{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;background:linear-gradient(#3b2a66e6,#22174ae6);box-shadow:0 3px 0 #120b2a,inset 0 1px 0 #ffffff40,0 6px 18px #0004;font-weight:900;font-size:16px;letter-spacing:-.01em;text-shadow:0 2px 0 #120b2a;white-space:nowrap}
#hs{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
#hh{gap:4px}
#hh i{width:18px;height:16px;display:block;background:radial-gradient(circle at 30% 30%,#fff8 0 18%,transparent 20%),#5b4a7a;clip-path:path("M9 16 C9 16 0 10 0 4.8 C0 2 2.2 0 4.8 0 C6.6 0 8 1.1 9 2.6 C10 1.1 11.4 0 13.2 0 C15.8 0 18 2 18 4.8 C18 10 9 16 9 16Z")}
#hh i.on{background:radial-gradient(circle at 30% 30%,#fff9 0 18%,transparent 20%),linear-gradient(#ff7a8a,#e8344e)}
#hp{min-width:64px;justify-content:center;color:#ffe27a}
#hint{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:12px 22px;border-radius:24px;background:linear-gradient(#ffd94ae6,#ffb21ee6);color:#3a2000;font-weight:900;font-size:17px;box-shadow:0 4px 0 #a8640c,0 8px 20px #0005;pointer-events:none;animation:bob 1.6s ease-in-out infinite;white-space:nowrap}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
#nogl{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:#2a1f4a;font-size:18px;font-weight:800;line-height:1.5}
</style>
</head>
<body>
<canvas id="gl" aria-label="몸 갈아타기 게임 화면. 적을 톡 하면 유령이 그 몸으로 옮겨 타요"></canvas>
<canvas id="ov" aria-hidden="true"></canvas>
<div class="hud"><div class="pill" id="hs">1-1</div><div class="sp"></div><div class="pill" id="hh"></div><div class="pill" id="hp">0</div></div>
<div id="hint">톡해서 직접 해 보기</div>
<div id="nogl" hidden>이 기기에서는 3D 화면(WebGL2)을 켤 수 없어요.<br>다른 브라우저로 열어 주세요.</div>
<script>/*BUNDLE*/</script>
</body>
</html>
