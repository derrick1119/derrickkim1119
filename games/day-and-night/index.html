<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<meta name="description" content="THE LAMP 2: 낮과 밤 — 깨지기 쉬운 전구를 굴리고, 빛을 켜고 끄며 낮의 돌과 밤의 돌 사이를 건너는 퍼즐 플랫포머.">
<title>THE LAMP 2: 낮과 밤</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307080f'/%3E%3Ccircle cx='32' cy='28' r='24' fill='%23ffb45a' opacity='.22'/%3E%3Ccircle cx='32' cy='27' r='15' fill='%23fff0c0'/%3E%3Crect x='25' y='40' width='14' height='11' rx='3' fill='%237d8799'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="게임 화면"></canvas>

  <!-- 게임 중 HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-left">
        <div class="pill" id="stageName"></div>
        <div class="pill flowers" id="flowers"><i></i><i></i><i></i></div>
        <div class="pill crack hidden" id="crack"></div>
      </div>
      <div class="hud-right">
        <div class="pill time" id="time">0:00</div>
        <button id="btnPause" class="icon-btn" aria-label="pause"><svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
      </div>
    </div>
    <div id="tip" class="hidden"></div>
    <div class="pad pad-left">
      <button id="btnLeft" class="pbtn" aria-label="left"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8z"/></svg></button>
      <button id="btnRight" class="pbtn" aria-label="right"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8z"/></svg></button>
    </div>
    <div class="pad pad-right">
      <button id="btnLight" class="pbtn light on" aria-label="light"><svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 0-4 12.7V17h8v-1.3A7 7 0 0 0 12 3zM9 18.5h6V20a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 20z"/></svg><span id="lightLabel"></span></button>
      <button id="btnJump" class="pbtn jump" aria-label="jump"><svg viewBox="0 0 24 24"><path d="M12 4 4 13h5v7h6v-7h5z"/></svg><span id="jumpLabel"></span></button>
    </div>
  </div>

  <!-- 타이틀 -->
  <section id="screen-title" class="screen">
    <div class="title-wrap">
      <div class="logo">
        <div class="logo-lamp" aria-hidden="true"></div>
        <h1>THE LAMP <span>2</span></h1>
        <p class="logo-sub" data-t="sub"></p>
      </div>
      <p class="tagline" data-t="tagline"></p>
      <p class="story" data-t="story"></p>
      <div class="menu">
        <button id="btnStart" class="btn primary"></button>
        <div class="menu-row">
          <button id="btnStages" class="btn" data-t="btn.stages"></button>
          <button id="btnHow" class="btn" data-t="btn.how"></button>
        </div>
      </div>
      <p class="rotate-hint" data-t="hint.rotate"></p>
    </div>
    <div class="corner">
      <span class="flower-chip"><i class="fl"></i><b id="titleFlowers">0</b></span>
      <button id="btnSound" class="chip"></button>
      <button id="btnLang" class="chip" data-t="btn.lang"></button>
      <button id="btnFull" class="chip" data-t="btn.full"></button>
    </div>
  </section>

  <!-- 스테이지 선택 -->
  <section id="screen-select" class="screen panel-screen hidden">
    <div class="panel wide">
      <div class="panel-head">
        <h2 data-t="sel.title"></h2>
        <span class="flower-chip big"><i class="fl"></i><b id="selFlowers">0</b></span>
      </div>
      <div id="stageList" class="stage-list"></div>
      <div class="skins">
        <span class="muted" data-t="sel.skins"></span>
        <div id="skinList" class="skin-list"></div>
      </div>
      <button class="btn" data-back data-t="btn.back"></button>
    </div>
  </section>

  <!-- 플레이 방법 -->
  <section id="screen-how" class="screen panel-screen hidden">
    <div class="panel">
      <h2 data-t="how.title"></h2>
      <div class="how-grid">
        <div class="how-item light"><h3 data-t="how.1.t"></h3><p data-t="how.1.d"></p></div>
        <div class="how-item dark"><h3 data-t="how.2.t"></h3><p data-t="how.2.d"></p></div>
        <div class="how-item light"><h3 data-t="how.3.t"></h3><p data-t="how.3.d"></p></div>
        <div class="how-item dawn"><h3 data-t="how.4.t"></h3><p data-t="how.4.d"></p></div>
      </div>
      <p class="keys" id="howKeys"></p>
      <button class="btn" data-back data-t="btn.back"></button>
    </div>
  </section>

  <!-- 일시정지 -->
  <div id="overlay-pause" class="overlay hidden">
    <div class="panel narrow">
      <h2 data-t="pause.title"></h2>
      <p class="muted" id="pauseStage"></p>
      <button id="btnResume" class="btn primary" data-t="btn.resume"></button>
      <button id="btnCheckpoint" class="btn" data-t="btn.checkpoint"></button>
      <button id="btnRestart" class="btn" data-t="btn.restart"></button>
      <div class="menu-row">
        <button id="btnSound2" class="btn"></button>
        <button id="btnQuit" class="btn" data-t="btn.stages"></button>
      </div>
    </div>
  </div>

  <!-- 스테이지 클리어 -->
  <div id="overlay-clear" class="overlay hidden">
    <div class="panel narrow result">
      <h2 id="clearTitle"></h2>
      <p class="muted" id="clearSub"></p>
      <div class="big-flowers" id="clearFlowers"><i></i><i></i><i></i></div>
      <div class="res-grid" id="clearGrid"></div>
      <div class="badges" id="clearBadges"></div>
      <button id="btnNext" class="btn primary" data-t="btn.next"></button>
      <div class="menu-row">
        <button id="btnRetry" class="btn" data-t="btn.retry"></button>
        <button id="btnClearStages" class="btn" data-t="btn.stages"></button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
