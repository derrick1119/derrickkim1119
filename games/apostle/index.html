<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06080d">
<meta name="description" content="THE LAMP: 빛의 사도 — 등불에도 검에도 활에도 깃드는 빛이 되어, 잃어버린 빛을 찾아가는 클레이 퍼즐 플랫포머">
<title>THE LAMP: 빛의 사도</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-state="title">
<canvas id="gl"></canvas>
<div class="fx blur top a"></div><div class="fx blur top b"></div>
<div class="fx blur bot a"></div><div class="fx blur bot b"></div>
<div class="fx" id="fx-vignette"></div>
<div class="fx" id="fx-grain"></div>
<div class="fx" id="fx-fade"></div>
<div id="boot" data-i18n="loading">점토를 빚는 중…</div>

<div id="hud">
  <div id="pips" aria-label="light"><i class="pip"></i><i class="pip"></i><i class="pip"></i></div>
  <button id="btnPause" class="icon" aria-label="pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
  <p id="tip"></p>
  <p id="whisper" data-k=""></p>
  <div id="hint" data-k=""><kbd id="hintKey">E</kbd><span id="hintLabel"></span></div>
  <div id="touch">
    <button id="tLeft" class="tb" aria-label="left"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7z"/></svg></button>
    <button id="tRight" class="tb" aria-label="right"><svg viewBox="0 0 24 24"><path d="M9 5l8 7-8 7z"/></svg></button>
    <button id="tUp" class="tb sm" aria-label="up"><svg viewBox="0 0 24 24"><path d="M5 15l7-8 7 8z"/></svg></button>
    <button id="tDown" class="tb sm" aria-label="down"><svg viewBox="0 0 24 24"><path d="M5 9l7 8 7-8z"/></svg></button>
    <button id="tPos" class="tb" aria-label="enter or leave"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4M5.3 5.3l2.8 2.8M15.9 15.9l2.8 2.8M18.7 5.3l-2.8 2.8M8.1 15.9l-2.8 2.8" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></button>
    <button id="tAct" class="tb" aria-label="act"><svg viewBox="0 0 24 24"><path d="M13 2L5 13.5h5.5L9.5 22l9-12.5H13z"/></svg></button>
    <button id="tJump" class="tb" aria-label="jump"><svg viewBox="0 0 24 24"><path d="M12 4l6 7h-4v9h-4v-9H6z"/></svg></button>
  </div>
</div>
<div id="story"><p id="storyText"></p><span class="more">▸</span></div>

<section id="screen-title" class="screen">
  <div class="panel title">
    <p class="ip">THE LAMP</p>
    <h1 data-i18n="title">빛의 사도</h1>
    <p class="tag" data-i18n="tagline">무엇에든 깃들어, 잃어버린 빛을 찾으러.</p>
    <div class="btns">
      <button id="btnContinue" class="btn primary hidden" data-i18n="cont">이어하기</button>
      <button id="btnStart" class="btn primary" data-i18n="start">시작</button>
      <button id="btnChapters" class="btn hidden" data-i18n="chapters">장 고르기</button>
    </div>
    <p class="keys" data-i18n="keys"></p>
    <div class="row"><button class="link" data-lang>English</button><a class="link" href="../../" data-i18n="hub">다른 램프 게임</a></div>
  </div>
</section>

<section id="screen-chapters" class="screen hidden">
  <div class="panel">
    <h2 data-i18n="chapters">장 고르기</h2>
    <div id="chapterList" class="btns col"></div>
    <div class="row"><button class="link" data-title data-i18n="back">돌아가기</button></div>
  </div>
</section>

<section id="screen-pause" class="screen hidden">
  <div class="panel">
    <h2 data-i18n="paused">잠시 멈춤</h2>
    <div class="btns col">
      <button id="btnResume" class="btn primary" data-i18n="resume">계속</button>
      <button id="btnRetry" class="btn" data-i18n="retry">제단의 순간으로</button>
      <button id="btnRestart" class="btn" data-i18n="restart">이 장 처음부터</button>
      <button class="btn" data-title data-i18n="toTitle">첫 화면</button>
    </div>
    <div class="row wrap">
      <button id="optSound" class="link">소리</button>
      <button id="optQuality" class="link">그림자</button>
      <button id="optFull" class="link" data-i18n="full">전체 화면</button>
      <button class="link" data-lang>English</button>
    </div>
    <p class="keys" data-i18n="keys"></p>
  </div>
</section>

<section id="screen-clear" class="screen hidden">
  <div class="panel">
    <p class="ip" id="clearName"></p>
    <h2 data-i18n="cleared">불이 다시 켜졌다</h2>
    <p id="clearLabel" class="label hidden" data-i18n="children">남은 밤의 아이들</p>
    <div id="clearStars" class="stars"></div>
    <dl><dt data-i18n="time">걸린 시간</dt><dd id="clearTime">0:00</dd></dl>
    <div class="btns"><button id="btnNext" class="btn primary" data-i18n="nextCh">다음 장으로</button><button id="btnReplay" class="btn" data-i18n="again">이 장 다시</button></div>
  </div>
</section>

<section id="screen-end" class="screen hidden">
  <div class="panel end">
    <p class="ip">THE LAMP</p>
    <h2 data-i18n="e_title">빛과 어둠은 다툰 적이 없었다</h2>
    <div id="endStars" class="stars"></div>
    <dl><dt data-i18n="e_stars">오늘 밤 뜬 별</dt><dd id="endCount">0 / 0</dd></dl>
    <p id="endLine" class="label"></p>
    <div class="btns"><button id="btnAgain" class="btn primary" data-i18n="e_again">처음부터 다시</button><button class="btn" data-title data-i18n="toTitle">첫 화면</button></div>
  </div>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
