<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06080d">
<meta name="description" content="THE LAMP: 불 꺼진 숲 — 점토로 빚은 어두운 숲을 전구 머리 아이가 건너는 말 없는 횡스크롤 어드벤처">
<title>THE LAMP: 불 꺼진 숲</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-state="title">
<canvas id="gl"></canvas>
<div class="fx blur top a"></div><div class="fx blur top b"></div>
<div class="fx blur bot a"></div><div class="fx blur bot b"></div>
<div class="fx" id="fx-vignette"></div>
<div class="fx" id="fx-grain"></div>
<div class="fx" id="fx-fade"></div>
<div id="boot" data-i18n="loading">점토를 빚는 중…</div>

<div id="hud">
  <button id="btnPause" class="icon" aria-label="pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
  <div id="hint" data-k="">
    <span class="h light"><kbd>F</kbd><svg viewBox="0 0 24 24"><path d="M12 2.5a6.2 6.2 0 0 0-3.6 11.3c.5.4.9 1 .9 1.7v.5h5.4v-.5c0-.7.4-1.3.9-1.7A6.2 6.2 0 0 0 12 2.5z"/><rect x="9.4" y="17.4" width="5.2" height="1.6" rx=".8"/><rect x="10.2" y="20" width="3.6" height="1.5" rx=".75"/></svg></span>
    <span class="h move"><kbd>←</kbd><kbd>→</kbd></span>
    <span class="h jump"><kbd class="wide">Space</kbd><svg viewBox="0 0 24 24"><path d="M12 4l6 7h-4v9h-4v-9H6z"/></svg></span>
    <span class="h grab"><kbd class="wide">Shift</kbd><svg viewBox="0 0 24 24"><path d="M7 11V6.5a1.5 1.5 0 0 1 3 0V10h1V4.5a1.5 1.5 0 0 1 3 0V10h1V6a1.5 1.5 0 0 1 3 0v8.5c0 3.6-2.6 6.5-6.2 6.5-2.6 0-4.3-1.3-5.6-3.7L4.3 13a1.5 1.5 0 0 1 2.6-1.4z"/></svg></span>
  </div>
  <div id="touch">
    <button id="tLeft" class="tb" aria-label="left"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7z"/></svg></button>
    <button id="tRight" class="tb" aria-label="right"><svg viewBox="0 0 24 24"><path d="M9 5l8 7-8 7z"/></svg></button>
    <button id="tGrab" class="tb" aria-label="grab"><svg viewBox="0 0 24 24"><path d="M7 11V6.5a1.5 1.5 0 0 1 3 0V10h1V4.5a1.5 1.5 0 0 1 3 0V10h1V6a1.5 1.5 0 0 1 3 0v8.5c0 3.6-2.6 6.5-6.2 6.5-2.6 0-4.3-1.3-5.6-3.7L4.3 13a1.5 1.5 0 0 1 2.6-1.4z"/></svg></button>
    <button id="tLight" class="tb" aria-label="light"><svg viewBox="0 0 24 24"><path d="M12 2.5a6.2 6.2 0 0 0-3.6 11.3c.5.4.9 1 .9 1.7v.5h5.4v-.5c0-.7.4-1.3.9-1.7A6.2 6.2 0 0 0 12 2.5z"/><rect x="9.4" y="17.4" width="5.2" height="1.6" rx=".8"/><rect x="10.2" y="20" width="3.6" height="1.5" rx=".75"/></svg></button>
    <button id="tJump" class="tb" aria-label="jump"><svg viewBox="0 0 24 24"><path d="M12 4l6 7h-4v9h-4v-9H6z"/></svg></button>
  </div>
</div>

<section id="screen-title" class="screen">
  <div class="panel title">
    <p class="ip">THE LAMP</p>
    <h1 data-i18n="title">불 꺼진 숲</h1>
    <p class="tag" data-i18n="tagline">불을 켜면 그들이 본다. 끄면 길이 보이지 않는다.</p>
    <div class="btns">
      <button id="btnContinue" class="btn primary hidden" data-i18n="cont">이어하기</button>
      <button id="btnStart" class="btn primary" data-i18n="start">시작</button>
    </div>
    <p class="keys" data-i18n="keys">이동 ← →　점프 Space　불빛 F　잡기 Shift</p>
    <div class="row"><button class="link" data-lang>English</button><a class="link" href="../../" data-i18n="hub">다른 램프 게임</a></div>
  </div>
</section>

<section id="screen-pause" class="screen hidden">
  <div class="panel">
    <h2 data-i18n="paused">잠시 멈춤</h2>
    <div class="btns col">
      <button id="btnResume" class="btn primary" data-i18n="resume">계속</button>
      <button id="btnRetry" class="btn" data-i18n="retry">등불에서 다시</button>
      <button id="btnRestart" class="btn" data-i18n="fresh">처음부터</button>
    </div>
    <div class="row wrap">
      <button id="optSound" class="link">소리</button>
      <button id="optQuality" class="link">그림자</button>
      <button id="optFull" class="link" data-i18n="full">전체 화면</button>
      <button class="link" data-lang>English</button>
    </div>
    <p class="keys" data-i18n="keys">이동 ← →　점프 Space　불빛 F　잡기 Shift</p>
  </div>
</section>

<section id="screen-end" class="screen hidden">
  <div class="panel end">
    <p class="ip">THE LAMP</p>
    <h2 data-i18n="end1">숲에 불이 켜졌다</h2>
    <dl>
      <dt data-i18n="flowers">피운 빛꽃</dt><dd id="endFlowers">0 / 7</dd>
      <dt data-i18n="deaths">깨진 횟수</dt><dd id="endDeaths">0</dd>
      <dt data-i18n="time">걸린 시간</dt><dd id="endTime">0:00</dd>
    </dl>
    <div class="btns"><button id="btnAgain" class="btn primary" data-i18n="again">처음부터 다시</button></div>
    <div class="row"><a class="link" href="../../" data-i18n="hub">다른 램프 게임</a></div>
  </div>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
